<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<title>ORION DevOps Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="ORION | DOCKER & DEVOPS ENGINEERING LAB — From Code to Production.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&family=Sora:wght@500;600;700&display=swap">
<style>
/* Layout : rail de navigation fixe à gauche (console d'ingénierie) + zone de travail ; sur mobile le rail devient un tiroir. */
:root{
  --bg:#06101d; --bg2:#0a1729; --panel:#0d1e34; --panel2:#11284a; --line:#1b3456; --line2:#28497a;
  --fg:#e6eef8; --muted:#8fa6c4; --dim:#5f7799;
  --docker:#2496ED; --docker-d:#1b74c2; --cyan:#3fdcef; --ok:#34d399; --warn:#f5b93a; --err:#f47272; --violet:#a594f9;
  --term:#030911; --term-fg:#cfe3f7;
  --f-display:"Sora","Segoe UI",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --f-mono:"JetBrains Mono","Cascadia Code",Consolas,monospace;
  --r:10px;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg2)}
a{color:var(--cyan)}
code,kbd,pre,.mono{font-family:var(--f-mono)}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:clamp(1.6rem,3.2vw,2.35rem);font-weight:700;letter-spacing:-.02em}
h2{font-size:1.3rem;font-weight:650;letter-spacing:-.01em}
h3{font-size:1.05rem;font-weight:600}
p{margin:0}
.muted{color:var(--muted)} .dim{color:var(--dim)}
.small{font-size:.85rem}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:272px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:linear-gradient(180deg,var(--bg2),var(--bg));border-right:1px solid var(--line);padding:18px 14px 28px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;gap:10px;align-items:center;padding:4px 6px 10px;border-bottom:1px solid var(--line)}
.brand-mark{width:38px;height:38px;flex:none}
.brand b{font-family:var(--f-display);font-size:.95rem;letter-spacing:.06em;display:block}
.brand span{font-size:.72rem;color:var(--muted);letter-spacing:.04em}
.side-prog{padding:10px 8px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
.side-prog .row{display:flex;justify-content:space-between;font-size:.78rem;color:var(--muted)}
.nav-g{font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--dim);padding:10px 8px 4px}
.nav a{display:flex;align-items:center;gap:9px;padding:6px 8px;border-radius:7px;color:var(--muted);text-decoration:none;font-size:.88rem}
.nav a:hover{background:var(--panel);color:var(--fg)}
.nav a.on{background:linear-gradient(90deg,rgba(36,150,237,.22),rgba(36,150,237,.04));color:#fff}
.nav .dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--dim);flex:none}
.nav .dot.v{border-color:var(--docker)}
.nav .dot.d{background:var(--ok);border-color:var(--ok)}
.nav .num{font-family:var(--f-mono);font-size:.68rem;color:var(--dim);width:18px}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:40;display:flex;align-items:center;gap:12px;padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:rgba(6,16,29,.88);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.crumb{font-size:.82rem;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb b{color:var(--fg);font-weight:600}
.top .sp{flex:1}
.top .menu-btn{display:none}
.lvl-pill{display:flex;align-items:center;gap:8px;padding:4px 10px 4px 6px;border:1px solid var(--line2);border-radius:99px;font-size:.78rem;white-space:nowrap}
.lvl-pill i{width:22px;height:22px;border-radius:50%;background:var(--docker);display:grid;place-items:center;font-style:normal;font-weight:700;font-size:.7rem;font-family:var(--f-mono)}
.view{padding-block:26px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1180px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:22px}

.view>*,.sec>*,.split>*,.grid>*,.card>*,.steps>*,.step>*{min-width:0;max-width:100%}
a.btn,a.mod-tile{text-decoration:none}
.term-h{flex-wrap:wrap}

/* ---------- module header ---------- */
.mhead{display:grid;gap:10px;padding:22px;border:1px solid var(--line);border-radius:14px;background:radial-gradient(120% 140% at 100% 0%,rgba(36,150,237,.20),transparent 55%),var(--panel);position:relative;overflow:hidden}
.mhead::after{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px;opacity:.18;pointer-events:none;mask-image:linear-gradient(90deg,transparent 30%,#000)}
.eyebrow{font-family:var(--f-mono);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan)}
.mhead p{max-width:72ch;color:var(--muted)}
.method{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.method span{font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;padding:3px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--muted)}

/* ---------- blocks ---------- */
.sec{display:grid;gap:12px}
.sec>h2{display:flex;align-items:center;gap:10px}
.sec>h2 .tag{font-family:var(--f-mono);font-size:.65rem;letter-spacing:.1em;padding:2px 7px;border-radius:5px;background:rgba(36,150,237,.16);color:var(--docker)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card.flat{background:transparent}
.card h3{margin-bottom:6px}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
.analogy{border-left:3px solid var(--violet);padding:8px 12px;background:rgba(165,148,249,.07);border-radius:0 8px 8px 0;font-size:.92rem}
.analogy b{color:var(--violet)}
.warnbox{border-left:3px solid var(--warn);padding:8px 12px;background:rgba(245,185,58,.08);border-radius:0 8px 8px 0;font-size:.9rem}
.errbox{border-left:3px solid var(--err);padding:8px 12px;background:rgba(244,114,114,.08);border-radius:0 8px 8px 0;font-size:.9rem}
.okbox{border-left:3px solid var(--ok);padding:8px 12px;background:rgba(52,211,153,.08);border-radius:0 8px 8px 0;font-size:.9rem}
.simbadge{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:rgba(245,185,58,.12);color:var(--warn);border:1px solid rgba(245,185,58,.35)}
.realbadge{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:.68rem;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:5px;background:rgba(52,211,153,.1);color:var(--ok);border:1px solid rgba(52,211,153,.35)}
ul.clean{margin:0;padding-left:18px;display:grid;gap:4px}
ul.clean li::marker{color:var(--docker)}
.pill{display:inline-block;font-size:.72rem;padding:2px 8px;border-radius:99px;border:1px solid var(--line2);color:var(--muted);font-family:var(--f-mono)}
.pill.ok{color:var(--ok);border-color:rgba(52,211,153,.45)}
.pill.warn{color:var(--warn);border-color:rgba(245,185,58,.45)}
.pill.err{color:var(--err);border-color:rgba(244,114,114,.45)}
.pill.blue{color:var(--docker);border-color:rgba(36,150,237,.5)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}

/* ---------- buttons & inputs ---------- */
.btn{font:inherit;font-size:.86rem;font-weight:500;display:inline-flex;align-items:center;gap:6px;padding:7px 13px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--docker);background:#15325a}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--docker);border-color:var(--docker);color:#fff}
.btn.primary:hover{background:#3aa6f5}
.btn.ghost{background:transparent}
.btn.danger{border-color:rgba(244,114,114,.5);color:var(--err);background:transparent}
.btn.sm{padding:4px 9px;font-size:.78rem}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.on{border-color:var(--cyan);color:var(--cyan)}
input[type=text],input[type=search],select,textarea{font:inherit;color:var(--fg);background:var(--bg2);border:1px solid var(--line2);border-radius:8px;padding:8px 10px;width:100%}
input[type=text]:focus,input[type=search]:focus,select:focus,textarea:focus{outline:none;border-color:var(--docker)}
textarea{font-family:var(--f-mono);font-size:.82rem;line-height:1.55;resize:vertical}
label.chk{display:flex;gap:9px;align-items:flex-start;cursor:pointer;font-size:.9rem}
label.chk input{margin-top:4px;accent-color:var(--docker)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:8px}
.tabs button{font:inherit;font-size:.84rem;padding:6px 12px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--muted);cursor:pointer}
.tabs button:hover{color:var(--fg)}
.tabs button.on{background:var(--panel2);border-color:var(--line2);color:#fff}

/* ---------- code ---------- */
.code{position:relative;border:1px solid var(--line);border-radius:var(--r);background:var(--term);min-width:0}
.code .bar{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 10px;border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:.7rem;color:var(--dim);letter-spacing:.06em}
.code pre{margin:0;padding:12px 14px;overflow-x:auto;font-size:.8rem;line-height:1.6;color:var(--term-fg)}
.copy{font:inherit;font-family:var(--f-mono);font-size:.7rem;padding:2px 8px;border-radius:5px;border:1px solid var(--line2);background:transparent;color:var(--muted);cursor:pointer}
.copy:hover{color:var(--fg);border-color:var(--docker)}
.tk-c{color:#5f7799;font-style:italic}.tk-k{color:#5cb8ff;font-weight:600}.tk-s{color:#9be28a}.tk-n{color:#f5b93a}.tk-f{color:#c3a6ff}.tk-v{color:#3fdcef}.tk-p{color:#ff9e7a}
.inline{font-family:var(--f-mono);font-size:.84em;padding:1px 6px;border-radius:5px;background:rgba(36,150,237,.12);color:#bfe0ff;border:1px solid rgba(36,150,237,.2);white-space:nowrap}

/* ---------- terminal ---------- */
.term{background:var(--term);border:1px solid var(--line2);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;min-width:0;box-shadow:0 20px 50px -30px rgba(36,150,237,.45)}
.term-h{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#081324;border-bottom:1px solid var(--line)}
.term-h .lights{display:flex;gap:6px}.term-h .lights i{width:10px;height:10px;border-radius:50%;background:#2a3f5f}
.term-h .lights i:nth-child(1){background:#f47272}.term-h .lights i:nth-child(2){background:#f5b93a}.term-h .lights i:nth-child(3){background:#34d399}
.term-h .ttl{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.term-out{font-family:var(--f-mono);font-size:.78rem;line-height:1.55;padding:12px 14px;overflow:auto;height:360px;white-space:pre;color:var(--term-fg)}
.term-out .l-cmd{color:#fff}.term-out .l-cmd .ps{color:var(--ok)}
.term-out .l-err{color:var(--err)}.term-out .l-warn{color:var(--warn)}.term-out .l-note{color:var(--violet);white-space:pre-wrap}.term-out .l-ok{color:var(--ok)}.term-out .l-dim{color:var(--dim)}
.term-in{display:flex;align-items:center;gap:8px;padding:8px 12px;border-top:1px solid var(--line);background:#050d19}
.term-in .ps{font-family:var(--f-mono);font-size:.8rem;color:var(--ok);white-space:nowrap}
.term-in input{flex:1;min-width:0;background:transparent;border:0;color:#fff;font-family:var(--f-mono);font-size:.82rem;padding:4px 0}
.term-in input:focus{outline:none}
.sugg{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-top:1px solid var(--line);background:#071121;max-height:96px;overflow-y:auto}
.sugg button{font-family:var(--f-mono);font-size:.7rem;padding:3px 8px;border-radius:5px;border:1px solid var(--line2);background:transparent;color:var(--muted);cursor:pointer;white-space:nowrap}
.sugg button:hover{color:#fff;border-color:var(--docker)}

/* ---------- diagrams ---------- */
.diagram{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:radial-gradient(100% 100% at 50% 0%,rgba(36,150,237,.08),transparent 70%),var(--bg2);padding:12px}
.diagram svg{display:block;width:100%;min-width:0;height:auto}
@media (max-width:600px){.diagram svg{min-width:540px}}
.diagram svg text{font-family:var(--f-body);fill:var(--fg)}
.diagram .clk{cursor:pointer}
.diagram .clk:hover rect,.diagram .clk.sel rect{stroke:var(--cyan);stroke-width:2}
.flowline{stroke:var(--line2);stroke-width:2;fill:none}
.flowline.act{stroke:var(--cyan);stroke-dasharray:6 6;animation:dash 0.8s linear infinite}
@keyframes dash{to{stroke-dashoffset:-12}}
.info-panel{border:1px solid var(--line2);border-radius:var(--r);background:var(--panel);padding:14px;min-height:120px}
.info-panel h3{color:var(--cyan)}

/* step flows */
.steps{display:grid;gap:8px}
.step{display:grid;grid-template-columns:34px minmax(0,1fr);gap:10px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);transition:border-color .3s,background .3s,opacity .3s}
.step .n{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;font-family:var(--f-mono);font-size:.78rem;background:var(--bg2);border:1px solid var(--line2);color:var(--muted)}
.step.act{border-color:var(--cyan);background:linear-gradient(90deg,rgba(63,220,239,.10),var(--panel))}
.step.act .n{background:var(--cyan);color:#04121f;border-color:var(--cyan)}
.step.done .n{background:var(--ok);color:#04121f;border-color:var(--ok)}
.step.fail{border-color:var(--err)}.step.fail .n{background:var(--err);color:#fff;border-color:var(--err)}
.step.skip{opacity:.5}
.step .t{font-weight:600}
.step p{font-size:.88rem;color:var(--muted)}

/* pipeline */
.pipe{display:flex;gap:0;overflow-x:auto;padding:6px 2px 12px}
.stage{flex:1 0 108px;display:flex;flex-direction:column;align-items:center;gap:6px;position:relative;text-align:center}
.stage::before{content:"";position:absolute;top:19px;left:-50%;width:100%;height:2px;background:var(--line2);z-index:0}
.stage:first-child::before{display:none}
.stage.success::before,.stage.running::before{background:var(--ok)}
.stage .b{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--bg2);border:2px solid var(--line2);z-index:1;font-family:var(--f-mono);font-size:.75rem;color:var(--muted);transition:all .3s}
.stage.running .b{border-color:var(--cyan);color:var(--cyan);box-shadow:0 0 0 6px rgba(63,220,239,.12);animation:pulse 1s ease-in-out infinite}
.stage.success .b{background:var(--ok);border-color:var(--ok);color:#03140d}
.stage.failed .b{background:var(--err);border-color:var(--err);color:#fff}
.stage.skipped .b{border-style:dashed;opacity:.6}
.stage .lbl{font-size:.74rem;color:var(--muted);line-height:1.25;padding:0 4px}
.stage .st{font-family:var(--f-mono);font-size:.62rem;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.stage.running .st{color:var(--cyan)}.stage.success .st{color:var(--ok)}.stage.failed .st{color:var(--err)}
@keyframes pulse{50%{box-shadow:0 0 0 10px rgba(63,220,239,.04)}}

/* layer stacks */
.stack{display:flex;flex-direction:column-reverse;gap:6px}
.layer{padding:10px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center;transition:transform .2s,border-color .2s,background .2s;font-size:.88rem}
.layer:hover,.layer.sel{border-color:var(--cyan);transform:translateX(4px)}
.layer .sz{font-family:var(--f-mono);font-size:.72rem;color:var(--muted)}
.layer.hw{background:#1a2333}.layer.os{background:#183052}.layer.eng{background:linear-gradient(90deg,#0f4c86,#1b74c2)}.layer.hyp{background:#3b2f6b}.layer.gos{background:#25406b}.layer.app{background:#0e3b4a}
.layer.cached{border-color:rgba(52,211,153,.6)}
.layer.rebuilt{border-color:rgba(245,185,58,.7)}
.layer.new{animation:dropin .45s ease-out both}
@keyframes dropin{from{opacity:0;transform:translateY(-14px)}to{opacity:1;transform:none}}

/* meters */
.meter{height:8px;border-radius:99px;background:var(--bg2);overflow:hidden;border:1px solid var(--line)}
.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--docker),var(--cyan));border-radius:99px;transition:width .6s}
.kpi{display:grid;gap:4px}
.kpi .v{font-family:var(--f-display);font-size:1.7rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.kpi .k{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em}

/* tables */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r)}
.tbl table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:560px}
.tbl th,.tbl td{text-align:left;padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl th{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);background:var(--bg2);font-weight:600}
.tbl tr:last-child td{border-bottom:0}

/* quiz */
.q{display:grid;gap:12px}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:inherit;font-size:.9rem;padding:10px 12px;border-radius:9px;border:1px solid var(--line2);background:var(--panel2);color:var(--fg);cursor:pointer;display:grid;gap:4px}
.opt:hover:not([disabled]){border-color:var(--docker)}
.opt.sel{border-color:var(--cyan);background:#123457}
.opt.good{border-color:var(--ok);background:rgba(52,211,153,.10)}
.opt.bad{border-color:var(--err);background:rgba(244,114,114,.10)}
.opt .why{font-size:.8rem;color:var(--muted)}
.opt[disabled]{cursor:default}

/* explorer */
.cmd-list{display:grid;gap:6px;max-height:640px;overflow-y:auto;padding-right:4px}
.cmd-item{text-align:left;font:inherit;padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer;display:grid;gap:2px}
.cmd-item:hover,.cmd-item.on{border-color:var(--docker)}
.cmd-item code{font-size:.8rem;color:#bfe0ff}
.cmd-item span{font-size:.76rem;color:var(--muted)}
.danger-0{color:var(--ok)}.danger-1{color:var(--warn)}.danger-2{color:var(--err)}
.tokens{display:flex;flex-wrap:wrap;gap:6px}
.tokens .tok{font-family:var(--f-mono);font-size:.8rem;padding:5px 9px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);cursor:default}
.tokens .tok.k-cmd{border-color:var(--docker);color:#bfe0ff}.tokens .tok.k-flag{border-color:var(--violet);color:#d6ceff}.tokens .tok.k-val{border-color:var(--warn);color:#ffe2a8}.tokens .tok.k-img{border-color:var(--ok);color:#b8f5dd}.tokens .tok.k-arg{border-color:var(--cyan);color:#c4f6fd}
.explain-list{display:grid;gap:6px}
.sec>h2{flex-wrap:wrap}
.explain-list code,.tokens .tok{overflow-wrap:anywhere}
.explain-list div{display:grid;grid-template-columns:minmax(70px,40%) minmax(0,1fr);gap:12px;font-size:.88rem;padding:6px 0;border-bottom:1px dashed var(--line)}
.explain-list code{color:#bfe0ff}

/* editor */
.editor{position:relative;border:1px solid var(--line2);border-radius:var(--r);background:var(--term);overflow:hidden;min-width:0}
.editor .lines{display:grid;font-family:var(--f-mono);font-size:.8rem;line-height:1.65;padding:8px 0;overflow-x:auto;max-height:460px;overflow-y:auto}
.editor .ln{display:grid;grid-template-columns:38px minmax(0,1fr);cursor:pointer;white-space:pre;padding-right:12px}
.editor .ln:hover{background:rgba(36,150,237,.08)}
.editor .ln.sel{background:rgba(63,220,239,.12)}
.editor .ln.warnl{background:rgba(245,185,58,.08)}
.editor .ln .no{color:var(--dim);text-align:right;padding-right:10px;user-select:none}

/* chips/graph */
.svc{fill:var(--panel2);stroke:var(--line2);stroke-width:1.5}
.svc.up{stroke:var(--ok)}
.svc.down{stroke:var(--line2)}

/* toast */
.toast{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:90;background:var(--panel2);border:1px solid var(--docker);color:var(--fg);padding:10px 14px;border-radius:10px;font-size:.86rem;box-shadow:0 10px 30px rgba(0,0,0,.4);transform:translateY(20px);opacity:0;transition:all .25s;pointer-events:none;max-width:min(380px,calc(100vw - 32px))}
.toast.show{transform:none;opacity:1}

/* module footer */
.mfoot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;padding-top:18px;border-top:1px solid var(--line)}
.check-q{border:1px dashed var(--line2);border-radius:var(--r);padding:16px;background:rgba(36,150,237,.04)}

/* dashboard */
.ring{width:120px;height:120px;flex:none}
.ring circle{fill:none;stroke-width:10}
.lvl-track{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px}
.lvl-track div{padding:8px;border-radius:8px;border:1px solid var(--line);font-size:.72rem;color:var(--dim);text-align:center;line-height:1.3}
.lvl-track div.got{border-color:var(--docker);color:var(--fg);background:rgba(36,150,237,.1)}
.lvl-track div.cur{border-color:var(--cyan);box-shadow:inset 0 0 0 1px var(--cyan);color:#fff}
.mod-tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:8px}
.mod-tile{display:grid;gap:4px;padding:10px 12px;border-radius:9px;border:1px solid var(--line);background:var(--panel);text-decoration:none;color:var(--fg);font-size:.86rem}
.mod-tile:hover{border-color:var(--docker)}
.mod-tile .s{font-size:.7rem;font-family:var(--f-mono);color:var(--dim)}
.mod-tile.d .s{color:var(--ok)}.mod-tile.v .s{color:var(--docker)}

/* containers visual */
.boxes{display:flex;gap:10px;flex-wrap:wrap}
.cbox{border:1.5px solid var(--line2);border-radius:10px;padding:10px;min-width:150px;flex:1;background:var(--panel2);transition:all .3s;font-size:.82rem}
.cbox.run{border-color:var(--ok)}
.cbox.stop{opacity:.55}
.cbox .nm{font-family:var(--f-mono);font-weight:600;font-size:.8rem}
.spark{width:100%;height:34px}
.spark path{fill:none;stroke:var(--cyan);stroke-width:1.6}
.spark .area{fill:rgba(63,220,239,.12);stroke:none}

/* conflict */
.diff-del{color:var(--err)}.diff-add{color:var(--ok)}

/* responsive */
@media (max-width:960px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:80;transform:translateX(-105%);transition:transform .25s;height:100%;padding-top:calc(18px + env(safe-area-inset-top,0px));padding-left:max(14px,env(safe-area-inset-left,0px))}
  .side.open{transform:none;box-shadow:20px 0 60px rgba(0,0,0,.6)}
  .top .menu-btn{display:inline-flex}
  .split{grid-template-columns:minmax(0,1fr)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:70}
  .lvl-track{grid-template-columns:repeat(3,minmax(0,1fr))}
}
@media (max-width:520px){
  .lvl-pill .t{display:none}
  .term-out{height:300px}
  .mhead{padding:16px}
}
@media (prefers-reduced-motion:reduce){
  *{animation:none!important;transition:none!important}
}

const GHA_PRO=`name: build-test-deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  id-token: write   # nécessaire pour OIDC vers AWS

env:
  AWS_REGION: eu-west-3
  ECR_REPOSITORY: mon-app

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest -q

  build-push:
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      image: \${{ steps.meta.outputs.image }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-deploy
          aws-region: \${{ env.AWS_REGION }}
      - name: Login to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push
        id: meta
        run: |
          IMAGE=\${{ steps.ecr.outputs.registry }}/\${{ env.ECR_REPOSITORY }}:\${{ github.sha }}
          docker build -t $IMAGE .
          docker push $IMAGE
          echo "image=$IMAGE" >> $GITHUB_OUTPUT

  deploy:
    needs: build-push
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::123456789012:role/github-actions-deploy
          aws-region: \${{ env.AWS_REGION }}
      - name: Render task definition
        id: task
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .aws/task-definition.json
          container-name: app
          image: \${{ needs.build-push.outputs.image }}
      - name: Deploy to ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: \${{ steps.task.outputs.task-definition }}
          service: mon-app-service
          cluster: mon-cluster
          wait-for-service-stability: true

/* ---------- Coloration syntaxique ---------- */
function hl(src,lang){
  const lines=String(src).split('\n');
  return lines.map(line=>hlLine(line,lang)).join('\n');
}
function hlLine(line,lang){
  let e=esc(line);
  if(lang==='dockerfile'){
    if(/^\s*#/.test(line))return `<span class="tk-c">${e}</span>`;
    e=e.replace(/^(\s*)([A-Z]+)(\b)/,(m,a,b,c)=>INSTR[b]||b==='AS'?`${a}<span class="tk-k">${b}</span>${c}`:m);
    e=e.replace(/(\s)(AS)(\s)/,'$1<span class="tk-k">$2</span>$3');
    e=e.replace(/(&quot;[^&]*?&quot;)/g,'<span class="tk-s">$1</span>');
    e=e.replace(/(\s)(--[a-z-]+)(=?)/g,'$1<span class="tk-f">$2</span>$3');
    e=e.replace(/(\$[A-Z_]+|\$\{[^}]+\})/g,'<span class="tk-v">$1</span>');
    return e;
  }
  if(lang==='yaml'){
    const ci=line.search(/\s#|^#/);let code=line,com='';
    if(ci>=0&&!/['"][^'"]*#/.test(line.slice(0,ci+2))){code=line.slice(0,ci);com=line.slice(ci)}
    let c=esc(code);
    c=c.replace(/^(\s*-?\s*)([A-Za-z0-9_.\-/]+)(:)(?=\s|$)/,'$1<span class="tk-k">$2</span>$3');
    c=c.replace(/(&quot;.*?&quot;|&#39;.*?&#39;)/g,'<span class="tk-s">$1</span>');
    c=c.replace(/(\$\{\{.*?\}\})/g,'<span class="tk-v">$1</span>');
    c=c.replace(/(:\s+)(true|false|\d+)$/,'$1<span class="tk-n">$2</span>');
    return c+(com?`<span class="tk-c">${esc(com)}</span>`:'');
  }
  if(lang==='json'){
    e=e.replace(/(&quot;[^&]*?&quot;)(\s*:)/g,'<span class="tk-k">$1</span>$2');
    e=e.replace(/(:\s*)(&quot;.*?&quot;)/g,'$1<span class="tk-s">$2</span>');
    e=e.replace(/(\[|,\s*)(&quot;[^&]*?&quot;)/g,'$1<span class="tk-s">$2</span>');
    return e;
  }
  if(lang==='bash'){
    if(/^\s*#/.test(line))return `<span class="tk-c">${e}</span>`;
    e=e.replace(/(\s#\s.*)$/,'<span class="tk-c">$1</span>');
    e=e.replace(/^(\s*)(docker|aws|git|kubectl|curl|echo|pip|npm|mkdir|python|cd|ls|IMAGE=)/,'$1<span class="tk-k">$2</span>');
    e=e.replace(/(\s)(-{1,2}[a-zA-Z][\w-]*)/g,'$1<span class="tk-f">$2</span>');
    e=e.replace(/(&quot;.*?&quot;)/g,'<span class="tk-s">$1</span>');
    e=e.replace(/(\$\(?[A-Za-z_][\w ._-]*\)?)/g,'<span class="tk-v">$1</span>');
    return e;
  }
  if(lang==='py'||lang==='js'){
    if(/^\s*(#|\/\/)/.test(line))return `<span class="tk-c">${e}</span>`;
    e=e.replace(/(&quot;.*?&quot;|&#39;.*?&#39;)/g,'<span class="tk-s">$1</span>');
    e=e.replace(/\b(from|import|def|return|const|require|async|await|function|class|if|else|new|assert)\b/g,'<span class="tk-k">$1</span>');
    e=e.replace(/(@[\w.]+)/g,'<span class="tk-f">$1</span>');
    return e;
  }
  return e;
}
function langOf(name){name=name.toLowerCase();if(name.includes('dockerfile'))return'dockerfile';if(/\.ya?ml$/.test(name)||name.includes('compose'))return'yaml';if(name.endsWith('.json')||name.includes('.json'))return'json';if(name.endsWith('.py'))return'py';if(name.endsWith('.js'))return'js';return'bash'}

/* ---------- Mini parseur YAML (sous-ensemble Compose / Actions) ---------- */
class YamlError extends Error{constructor(line,msg){super(`Ligne ${line} : ${msg}`);this.line=line}}
function stripComment(s){let q=null;for(let i=0;i<s.length;i++){const c=s[i];if(q){if(c===q)q=null}else if(c==='"'||c==="'")q=c;else if(c==='#'&&(i===0||/\s/.test(s[i-1])))return s.slice(0,i)}return s}
function yScalar(v){v=v.trim();if(v==='')return null;
  if(/^\[.*\]$/.test(v)){const inner=v.slice(1,-1).trim();if(!inner)return[];const out=[];let cur='',q=null;for(const c of inner){if(q){cur+=c;if(c===q)q=null}else if(c==='"'||c==="'"){q=c;cur+=c}else if(c===','){out.push(yScalar(cur));cur=''}else cur+=c}out.push(yScalar(cur));return out}
  if(/^".*"$/.test(v)||/^'.*'$/.test(v))return v.slice(1,-1);
  if(v==='true')return true;if(v==='false')return false;if(v==='null'||v==='~')return null;
  if(/^-?\d+(\.\d+)?$/.test(v))return Number(v);return v}
function parseYAML(src){
  if(/\t/.test(src)){const i=src.split('\n').findIndex(l=>/^\s*\t/.test(l));if(i>=0)throw new YamlError(i+1,'tabulation interdite en YAML, utilisez des espaces')}
  const L=[];src.split('\n').forEach((raw,i)=>{const t=stripComment(raw).replace(/\s+$/,'');if(t.trim())L.push({ind:t.match(/^ */)[0].length,txt:t.trim(),n:i+1,raw})});
  let p=0;const KEY=/^("[^"]*"|'[^']*'|[^\s"'\-][^:]*?|-[^\s:][^:]*?)\s*:(\s+.*)?$/;
  function block(){if(p>=L.length)return null;return L[p].txt==='-'||L[p].txt.startsWith('- ')?list(L[p].ind):map(L[p].ind)}
  function blockScalar(ind,style){const parts=[];while(p<L.length&&L[p].ind>ind){parts.push(L[p].raw.slice(ind+2));p++}return style.startsWith('>')?parts.join(' '):parts.join('\n')}
  function map(ind){const o={};
    while(p<L.length&&L[p].ind===ind&&!(L[p].txt==='-'||L[p].txt.startsWith('- '))){
      const l=L[p];const m=l.txt.match(KEY);if(!m)throw new YamlError(l.n,`« ${l.txt} » : clé attendue (format clé: valeur)`);
      const k=yScalar(m[1]);if(Object.prototype.hasOwnProperty.call(o,k))throw new YamlError(l.n,`clé « ${k} » en double`);
      const v=(m[2]||'').trim();p++;
      if(v==='|'||v==='>'||v==='|-'||v==='>-')o[k]=blockScalar(ind,v);
      else if(v!=='')o[k]=yScalar(v);
      else if(p<L.length&&L[p].ind>ind)o[k]=block();
      else if(p<L.length&&L[p].ind===ind&&(L[p].txt==='-'||L[p].txt.startsWith('- ')))o[k]=list(ind);
      else o[k]=null;
    }
    if(p<L.length&&L[p].ind>ind)throw new YamlError(L[p].n,'indentation inattendue');
    return o}
  function list(ind){const a=[];
    while(p<L.length&&L[p].ind===ind&&(L[p].txt==='-'||L[p].txt.startsWith('- '))){
      const l=L[p];const item=l.txt.slice(1).trim();
      if(item===''){p++;a.push(p<L.length&&L[p].ind>ind?block():null);continue}
      if(KEY.test(item)&&!/^["']/.test(item)){const off=l.raw.indexOf(item);L[p]={ind:off,txt:item,n:l.n,raw:l.raw};a.push(map(off))}
      else{a.push(yScalar(item));p++}
    }
    if(p<L.length&&L[p].ind>ind)throw new YamlError(L[p].n,'indentation inattendue dans une liste');
    return a}
  if(!L.length)return{};
  if(L[0].ind!==0)throw new YamlError(L[0].n,'le document doit commencer sans indentation');
  const r=block();if(p<L.length)throw new YamlError(L[p].n,'indentation incohérente');return r}

/* ---------- Validation Compose ---------- */
function validateCompose(doc){
  const errs=[],warns=[];
  if(!doc||typeof doc!=='object'||!doc.services||typeof doc.services!=='object'){errs.push('La clé racine « services » est obligatoire.');return{errs,warns,svcs:[]}}
  if(doc.version)warns.push('La clé « version » est obsolète avec Compose v2 : vous pouvez la supprimer.');
  const vols=doc.volumes&&typeof doc.volumes==='object'?Object.keys(doc.volumes):[];
  const nets=doc.networks&&typeof doc.networks==='object'?Object.keys(doc.networks):[];
  const names=Object.keys(doc.services);const hostPorts={};const svcs=[];
  names.forEach(n=>{const s=doc.services[n]||{};const sv={name:n,image:s.image||null,build:s.build?(typeof s.build==='string'?s.build:(s.build.context||'.')):null,ports:[],deps:[],vols:[],nets:[],env:s.environment||{},hc:!!s.healthcheck};
    if(!s.image&&!s.build)errs.push(`Service « ${n} » : il faut « image » ou « build ».`);
    if(s.ports!=null&&!Array.isArray(s.ports))errs.push(`Service « ${n} » : « ports » doit être une liste.`);
    (Array.isArray(s.ports)?s.ports:[]).forEach(pt=>{const str=String(pt);const m=str.match(/^(?:([\d.]+):)?(\d+):(\d+)(\/\w+)?$|^(\d+)$/);
      if(!m){errs.push(`Service « ${n} » : port « ${str} » invalide (attendu "HÔTE:CONTAINER").`);return}
      if(m[5]){sv.ports.push({h:null,c:m[5]});return}
      sv.ports.push({h:m[2],c:m[3]});if(hostPorts[m[2]])errs.push(`Port hôte ${m[2]} utilisé par « ${hostPorts[m[2]]} » et « ${n} » : conflit « port is already allocated ».`);hostPorts[m[2]]=n;
      if(typeof pt==='string'&&false){} });
    if(Array.isArray(s.ports)&&s.ports.some(x=>typeof x==='number'||(/^\d+:\d+$/.test(String(x))&&Number(String(x).split(':')[1])<60&&false)))warns.push(`Service « ${n} » : mettez les ports entre guillemets ("80:80") pour éviter l'interprétation sexagésimale de YAML 1.1.`);
    const dep=s.depends_on;if(Array.isArray(dep))sv.deps=dep.map(String);else if(dep&&typeof dep==='object')sv.deps=Object.keys(dep).map(k=>{if(dep[k]&&dep[k].condition==='service_healthy'&&!(doc.services[k]||{}).healthcheck)warns.push(`« ${n} » attend que « ${k} » soit healthy, mais « ${k} » n'a pas de healthcheck.`);return k});
    sv.deps.forEach(d=>{if(!names.includes(d))errs.push(`Service « ${n} » dépend de « ${d} » qui n'existe pas.`)});
    (Array.isArray(s.volumes)?s.volumes:[]).forEach(v=>{const src=String(v).split(':')[0];const named=!/^[.\/~]/.test(src)&&String(v).includes(':');sv.vols.push({src,dst:String(v).split(':')[1]||'',named});if(named&&!vols.includes(src))errs.push(`Service « ${n} » : volume « ${src} » non déclaré dans la section volumes racine.`)});
    const nn=Array.isArray(s.networks)?s.networks:(s.networks&&typeof s.networks==='object'?Object.keys(s.networks):[]);sv.nets=nn.map(String);
    sv.nets.forEach(x=>{if(!nets.includes(x))errs.push(`Service « ${n} » : réseau « ${x} » non déclaré dans la section networks racine.`)});
    if(!sv.nets.length)sv.nets=['default'];
    const envStr=JSON.stringify(s.environment||{});if(/localhost|127\.0\.0\.1/.test(envStr))warns.push(`Service « ${n} » : « localhost » dans une variable désigne le container lui-même. Utilisez le nom du service.`);
    if(/PASSWORD/i.test(envStr))warns.push(`Service « ${n} » : mot de passe en clair. Acceptable en local ; en production utilisez des secrets.`);
    if(s.privileged===true)warns.push(`Service « ${n} » : privileged: true donne presque tous les droits de l'hôte.`);
    svcs.push(sv)});

/* ---------- Validation GitHub Actions ---------- */
function validateWorkflow(doc){
  const errs=[],warns=[],jobs=[];
  if(!doc||typeof doc!=='object'){errs.push('Document vide.');return{errs,warns,jobs}}
  if(!('on' in doc))errs.push('Clé « on » manquante : le workflow ne sait pas quand se déclencher.');
  if(!doc.jobs||typeof doc.jobs!=='object'){errs.push('Clé « jobs » manquante.');return{errs,warns,jobs}}
  const names=Object.keys(doc.jobs);
  names.forEach(n=>{const j=doc.jobs[n]||{};const job={name:n,steps:[],needs:[]};
    if(!j['runs-on'])errs.push(`Job « ${n} » : « runs-on » manquant${j['run-on']?' (vous avez écrit « run-on »)':''}.`);
    if(!Array.isArray(j.steps))errs.push(`Job « ${n} » : « steps » doit être une liste d'étapes (- name: …).`);
    else j.steps.forEach((s,i)=>{if(!s||typeof s!=='object'){errs.push(`Job « ${n} », étape ${i+1} : format invalide.`);return}
      if(!s.uses&&!s.run)errs.push(`Job « ${n} », étape ${i+1} : il faut « uses » ou « run ».`);
      if(s.uses&&s.run)errs.push(`Job « ${n} », étape ${i+1} : « uses » et « run » ne peuvent pas être combinés.`);
      if(s.uses&&!/@/.test(String(s.uses)))errs.push(`Job « ${n} », étape ${i+1} : épinglez la version de l'action (ex. actions/checkout@v4).`);
      job.steps.push({name:s.name||(s.uses?`Run ${s.uses}`:`Run ${String(s.run).split('\n')[0]}`),uses:s.uses,run:s.run})});
    const nd=j.needs?(Array.isArray(j.needs)?j.needs:[j.needs]):[];job.needs=nd.map(String);
    job.needs.forEach(x=>{if(!names.includes(x))errs.push(`Job « ${n} » : needs « ${x} » n'existe pas.`)});
    const txt=JSON.stringify(j);if(/AKIA[0-9A-Z]{12,}/.test(txt))errs.push(`Job « ${n} » : clé AWS en clair détectée ! Utilisez OIDC ou les secrets.`);
    if(/configure-aws-credentials/.test(txt)&&!(doc.permissions&&doc.permissions['id-token']==='write')&&!(j.permissions&&j.permissions['id-token']==='write'))warns.push(`Job « ${n} » : OIDC vers AWS nécessite permissions: id-token: write.`);
    jobs.push(job)});
  return{errs,warns,jobs}
}

function containerShell(sim,c,line){
  const a=line.trim().split(/\s+/);const cmd=a[0];const L=[];

    case'pwd':L.push(c.wd||'/');break;
    case'whoami':L.push(c.user||'root');break;
    case'id':L.push(c.user&&c.user!=='root'?'uid=10001(appuser) gid=10001(appuser) groups=10001(appuser)':'uid=0(root) gid=0(root) groups=0(root)');break;
    case'hostname':L.push(c.id.slice(0,12));break;
    case'echo':L.push(a.slice(1).join(' ').replace(/^["']|["']$/g,''));break;
    case'env':L.push('PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin',`HOSTNAME=${c.id.slice(0,12)}`,...Object.entries(c.env).map(([k,v])=>`${k}=${v}`),'HOME=/root');break;
    case'cat':if(a[1]==='/etc/os-release')L.push(os==='alpine'?'NAME="Alpine Linux"\nID=alpine\nVERSION_ID=3.20.3':c.image.startsWith('ubuntu')?'PRETTY_NAME="Ubuntu 24.04.1 LTS"\nNAME="Ubuntu"\nVERSION_ID="24.04"':'PRETTY_NAME="Debian GNU/Linux 12 (bookworm)"\nNAME="Debian GNU/Linux"\nVERSION_ID="12"');else if(a[1]==='/etc/hostname')L.push(c.id.slice(0,12));else L.push(`cat: ${a[1]||''}: No such file or directory`);break;
    case'ps':L.push('PID   USER     COMMAND','    1 '+(c.user||'root').padEnd(8)+' '+(c.kind==='web'?'nginx: master process nginx -g daemon off;':c.kind==='db'?'postgres':c.kind==='app'?'gunicorn app:app':c.cmd.replace(/"/g,'')),`   ${Math.floor(Math.random()*40+20)} ${(c.user||'root').padEnd(8)} ps`);break;
    case'curl':if(/localhost|127\.0\.0\.1/.test(a.join(' '))){if(c.kind==='web')L.push('<!DOCTYPE html>','<html><head><title>Welcome to nginx!</title></head>','…');else if(c.kind==='app')L.push('{"status":"ok"}');else L.push('curl: (7) Failed to connect to localhost port 80: Connection refused')}else L.push(`curl: (6) Could not resolve host: ${a[a.length-1]}`);break;
    case'ping':{const tgt=a[a.length-1];const other=sim.containers.find(x=>x.name===tgt&&x.status==='running');const shared=other&&other.nets.some(n=>c.nets.includes(n)&&n!=='bridge');
      if(shared){const net=sim.netByName(other.nets.find(n=>c.nets.includes(n)));L.push(`PING ${tgt} (${other.ips[net.name]||'172.18.0.3'}): 56 data bytes`,`64 bytes from ${other.ips[net.name]||'172.18.0.3'}: seq=0 ttl=64 time=0.081 ms`,`--- ${tgt} ping statistics ---`,'1 packets transmitted, 1 packets received, 0% packet loss')}
      else L.push(`ping: bad address '${tgt}'`)}break;
    case'psql':if(c.kind==='db')L.push(`psql (16.4)\nType "help" for help.\n\n${c.db||'postgres'}=# (session psql simulée — tapez exit)`);else L.push('sh: psql: not found');break;

class Terminal{

  }

function execLine(T,line,O){

  const a=tokenize(line);const S=T.sim;const cmd=a[0];
  if(cmd==='clear'){T.out.innerHTML='';return true}
  if(cmd==='help'){O.note(HELP_TXT);return true}
  if(cmd==='reset'){S.reset();if(T.kube)T.kube.reset();O.note('Environnement simulé réinitialisé.');return true}
  if(cmd==='history'){T.hist.forEach((h,i)=>O.o(`${String(i+1).padStart(4)}  ${h}`));return true}
  if(cmd==='ls'){O.o(S.files.join('  '));return true}
  if(cmd==='pwd'){O.o('/home/orion/projet');return true}
  if(cmd==='whoami'){O.o('orion');return true}
  if(cmd==='echo'){O.o(a.slice(1).join(' '));return true}
  if(cmd==='cat'){if(a[1]==='Dockerfile')O.o(DF_EXAMPLES.base.df);else if(a[1]==='compose.yaml')O.o(S.compose.src||COMPOSE_DEFAULT);else if(a[1]==='app.py')O.o('from flask import Flask\napp = Flask(__name__)\n\n@app.get("/")\ndef index():\n    return "Hello from Docker!"');else if(a[1]==='requirements.txt')O.o('flask==3.0.3\ngunicorn==23.0.0');else O.err(`cat: ${a[1]||''}: No such file or directory`);return true}
  if(cmd==='curl'){const m=line.match(/(?:localhost|127\.0\.0\.1):(\d+)/);const port=m?m[1]:(/localhost|127\.0\.0\.1/.test(line)?'80':null);
    if(!port){O.err('curl: (6) Could not resolve host (le simulateur ne sort pas sur Internet)');return false}
    const c=S.containers.find(c=>c.status==='running'&&c.ports.some(p=>p.h===port));
    if(!c){O.err(`curl: (7) Failed to connect to localhost port ${port} after 0 ms: Couldn't connect to server`);return false}
    const pm=c.ports.find(p=>p.h===port);
    if(c.kind==='web'&&pm.c==='80'){O.o('<!DOCTYPE html>\n<html>\n<head>\n<title>Welcome to nginx!</title>\n…\n<h1>Welcome to nginx!</h1>\n…\n</html>');c.logs.push(`172.17.0.1 - - [${new Date().toUTCString()}] "GET / HTTP/1.1" 200 615 "-" "curl/8.5.0"`);return true}
    if(c.kind==='app'&&String(c.appPort||8000)===pm.c){O.o(/health/.test(line)?'{"status":"ok"}':'Hello from Docker!');c.logs.push(`"GET ${/health/.test(line)?'/health':'/'} HTTP/1.1" 200`);return true}

  if(cmd==='kubectl'){if(!T.kube){O.note('kubectl est disponible dans le module Kubernetes (cluster simulé).');return false}return T.kube.exec(a.slice(1),O)}
  if(cmd==='aws')return awsSim(a.slice(1),O,line);
  if(cmd==='git'){O.note('Git est simulé dans le module « Git et GitHub » (workflow et conflit).');return false}
  if(cmd==='sudo'){O.warn('Inutile dans ce simulateur. Sous Linux, ajoutez plutôt votre utilisateur au groupe docker (droits équivalents à root : à réserver aux personnes de confiance).');return execLine(T,a.slice(1).join(' '),O)}

  if(cmd!=='docker'){O.err(`${cmd}: command not found`);O.note('Ce terminal simule Docker, kubectl (module Kubernetes) et quelques commandes AWS CLI. Les autres commandes nécessitent un vrai système.');return false}
  return dockerCmd(T,a.slice(1),O,line)
}

    if(k==='rollout'){const sub=a[1];const name=(a[2]||'').replace(/^deployment\//,'');
      if(sub==='status'){if(!this.deps[name]&&name){O.err(`Error from server (NotFound): deployments.apps "${name}" not found`);return false}O.o(`deployment "${name||Object.keys(this.deps)[0]||'web'}" successfully rolled out`);learn('rollout status');return true}
      if(sub==='history'){O.o(`deployment.apps/${name||'web'}\nREVISION  CHANGE-CAUSE\n1         kubectl apply -f deploy.yaml\n2         kubectl set image deployment/${name||'web'} web=nginx:1.26\n3         kubectl set image deployment/${name||'web'} web=nginx:1.27`);learn('rollout history');return true}
      if(sub==='undo'){const n=name||Object.keys(this.deps)[0];if(!this.deps[n]){O.err(`Error from server (NotFound): deployments.apps "${n}" not found`);return false}O.o(`deployment.apps/${n} rolled back`);O.note('Rollback effectué vers la révision précédente. Dans un vrai cluster : kubectl rollout status deployment/'+n);learn('rollout undo');return true}
      if(sub==='restart'){const n=name||Object.keys(this.deps)[0];if(!this.deps[n]){O.err(`Error from server (NotFound): deployments.apps "${n}" not found`);return false}O.o(`deployment.apps/${n} restarted`);O.note('Redémarrage progressif (rolling restart) déclenché.');learn('rollout restart');return true}
      O.err('Usage: kubectl rollout status|history|undo|restart deployment/NOM');return false}
    /* port-forward */
    if(k==='port-forward'){const tgt=a[1];const ports=a[2];if(!tgt||!ports){O.err('error: Usage: kubectl port-forward TYPE/NAME LOCAL_PORT:REMOTE_PORT');return false}const local=ports.split(':')[0];O.o(`Forwarding from 127.0.0.1:${local} -> ${ports.split(':')[1]||local}\nForwarding from [::1]:${local} -> ${ports.split(':')[1]||local}`);O.note(`Le port-forward est actif (simulé). Dans un vrai terminal : Ctrl+C pour l'arrêter. Ouvrez localhost:${local} dans votre navigateur.`);learn('port-forward');return true}
    /* top */
    if(k==='top'){const r=a[1];if(!r){O.err('error: command must be "top node" or "top pod"');return false}if(r==='node'||r==='nodes'){O.o(pad('NAME',18)+pad('CPU(cores)',12)+'MEMORY(bytes)');O.o(pad('control-plane',18)+pad('212m',12)+'942Mi');O.o(pad('worker-1',18)+pad('180m',12)+'768Mi');O.o(pad('worker-2',18)+pad('95m',12)+'512Mi');learn('top node');return true}if(/^pods?$/.test(r)){if(!this.pods.length){O.o('No resources found in default namespace.');return true}O.o(pad('NAME',34)+pad('CPU(cores)',12)+'MEMORY(bytes)');this.pods.forEach(p=>O.o(pad(p.name,34)+pad(p.cpu||'15m',12)+(p.mem||'48Mi')));learn('top pod');return true}O.err('error: command must be "top node" or "top pod"');return false}
    /* autoscale / hpa */
    if(k==='autoscale'){const n=(a.find(x=>x.startsWith('deployment/'))||'').slice(11)||(a[1]==='deployment'?a[2]:'');const min=+(a.find(x=>x.startsWith('--min='))||'--min=2').slice(6);const max=+(a.find(x=>x.startsWith('--max='))||'--max=10').slice(6);const cpu=+(a.find(x=>x.startsWith('--cpu-percent='))||'--cpu-percent=70').slice(14);if(!n){O.err('error: required flag "max" not set\nUsage: kubectl autoscale deployment NAME --min=N --max=N --cpu-percent=N');return false}if(!this.deps[n]){O.err(`Error from server (NotFound): deployments.apps "${n}" not found`);return false}this.hpas[n+'-hpa']={dep:n,min,max,target:cpu,cur:Math.floor(20+Math.random()*40)};O.o(`horizontalpodautoscaler.autoscaling/${n}-hpa autoscaled`);learn('autoscale');return true}
    /* set image */
    if(k==='set'&&a[1]==='image'){const dep=(a[2]||'').replace(/^deployment\//,'');const img=(a[3]||'').split('=')[1]||(a[3]||'');if(!this.deps[dep]){O.err(`Error from server (NotFound): deployments.apps "${dep}" not found`);return false}this.deps[dep].img=img;this.pods.filter(p=>p.dep===dep).forEach(p=>{p.img=img;p.status='Terminating'});setTimeout(()=>{this.pods.filter(p=>p.dep===dep).forEach(p=>p.status='Running')},800);O.o(`deployment.apps/${dep} image updated`);O.note('Rolling update en cours : les pods sont progressivement remplacés (25% max unavailable).');learn('set image');return true}
    /* expose */
    if(k==='expose'){const type=(a.find(x=>x.startsWith('--type='))||'--type=ClusterIP').slice(7);const port=(a.find(x=>x.startsWith('--port='))||'--port=80').slice(7);const name=a[2]||'my-service';this.svcs[name]={type,ip:`10.96.${Math.floor(100+Math.random()*150)}.${Math.floor(2+Math.random()*50)}`,port:port+(type==='NodePort'?`:3${Math.floor(1000+Math.random()*1000)}/TCP`:'/TCP')};O.o(`service/${name} exposed`);learn('expose');return true}
    /* config */
    if(k==='config'){if(a[1]==='get-contexts'){O.o('CURRENT   NAME          CLUSTER       AUTHINFO      NAMESPACE\n*         orion-lab    orion-cluster orion-admin   default');return true}if(a[1]==='current-context'){O.o('orion-lab');return true}O.note('Sous-commandes config simulées : get-contexts, current-context');return true}
    O.err(`error: unknown command "${k}" for "kubectl"\nCommandes simulées : get, apply, delete, create, scale, describe, logs, exec, rollout, port-forward, top, autoscale, set image, expose, config version, cluster-info`);return false}
}

/* ---------- Stepper générique (scènes SVG à groupes data-s) ---------- */
function Stepper(root,{steps,scene,interval=2600,sceneHtml=''}){
  let i=0,timer=null;
  root.innerHTML=`<div class="split"><div class="sc" style="min-width:0">${sceneHtml}</div><div style="display:grid;gap:10px;align-content:start"><div class="steps">${steps.map((s,k)=>`<div class="step" data-k="${k}" role="button" tabindex="0"><div class="n">${k+1}</div><div><div class="t">${s.t}</div><p>${s.d}</p></div></div>`).join('')}</div>
   <div class="row"><button class="btn sm" data-a="prev" type="button">← Précédent</button><button class="btn sm primary" data-a="play" type="button">▶ Lecture</button><button class="btn sm" data-a="next" type="button">Suivant →</button></div></div></div>`;
  const sc=$('.sc',root);const playB=$('[data-a=play]',root);
  function show(k){i=Math.max(0,Math.min(steps.length-1,k));$$('.step',root).forEach((el,j)=>{el.classList.toggle('act',j===i);el.classList.toggle('done',j<i)});scene(sc,i)}
  function stop(){clearInterval(timer);timer=null;playB.textContent='▶ Lecture'}
  playB.onclick=()=>{if(timer){stop();return}if(i>=steps.length-1)show(0);playB.textContent='❚❚ Pause';timer=setInterval(()=>{if(i>=steps.length-1){stop();return}show(i+1)},interval)};
  $('[data-a=prev]',root).onclick=()=>{stop();show(i-1)};$('[data-a=next]',root).onclick=()=>{stop();show(i+1)};
  $$('.step',root).forEach(el=>{el.onclick=()=>{stop();show(+el.dataset.k)};el.onkeydown=e=>{if(e.key==='Enter'){stop();show(+el.dataset.k)}}});
  onLeave(stop);show(0);return{show}
}
function fadeScene(sc,i){$$('[data-s]',sc).forEach(g=>{const s=+g.dataset.s;g.style.transition='opacity .5s';g.style.opacity=s<=i?1:.08});$$('[data-hl]',sc).forEach(g=>g.classList.toggle('hlon',+g.dataset.hl===i))}

/* ---------- Questions (quiz + vérif de compréhension) ---------- */
function renderQuestion(box,q,onDone){
  let sel=new Set();
  const opts=q.type==='tf'?['Vrai','Faux']:q.o;
  box.innerHTML=`<div class="q"><div class="row"><span class="pill blue">${{mcq:'QCM',tf:'Vrai ou faux',multi:'Réponses multiples',fill:'Compléter'}[q.type]}</span></div><h3>${esc(q.q)}</h3>
   ${q.type==='fill'?`<div class="row"><input type="text" id="fill-${hex(4)}" aria-label="Votre réponse" style="max-width:320px" class="mono"><button class="btn primary" data-a="val" type="button">Valider</button></div>`:
   `<div class="opts">${opts.map((o,k)=>`<button class="opt" data-k="${k}" type="button"><span>${esc(o)}</span></button>`).join('')}</div>${q.type==='multi'?'<div><button class="btn primary" data-a="val" type="button">Valider ma sélection</button></div>':''}`}
   <div class="fb"></div></div>`;
  const fb=$('.fb',box);let answered=false;
  const finish=(ok,txt)=>{answered=true;fb.innerHTML=`<div class="${ok?'okbox':'errbox'}"><b>${ok?'Correct.':'Pas tout à fait.'}</b> ${esc(txt)}</div>`;onDone&&onDone(ok)};
  if(q.type==='fill'){const inp=$('input',box);const v=()=>{if(answered)return;const val=inp.value.trim();if(!val)return;const ok=q.a.some(x=>x.toLowerCase()===val.toLowerCase());inp.disabled=true;finish(ok,(ok?'':`Réponse attendue : ${q.a[0]}. `)+q.x)};$('[data-a=val]',box).onclick=v;inp.onkeydown=e=>{if(e.key==='Enter')v()};return}
  const btns=$$('.opt',box);
  const reveal=(chosen)=>{btns.forEach((b,k)=>{b.disabled=true;const good=q.type==='tf'?(k===0)===q.a:q.type==='multi'?q.a.includes(k):k===q.a;if(good)b.classList.add('good');else if(chosen.has(k))b.classList.add('bad');if(q.w&&q.w[k])b.insertAdjacentHTML('beforeend',`<span class="why">${esc(q.w[k])}</span>`)})};
  btns.forEach(b=>b.onclick=()=>{if(answered)return;const k=+b.dataset.k;
    if(q.type==='multi'){sel.has(k)?sel.delete(k):sel.add(k);b.classList.toggle('sel');return}
    const ok=q.type==='tf'?(k===0)===q.a:k===q.a;reveal(new Set([k]));finish(ok,q.x)});
  if(q.type==='multi')$('[data-a=val]',box).onclick=()=>{if(answered||!sel.size)return;const ok=sel.size===q.a.length&&q.a.every(x=>sel.has(x));reveal(sel);$('[data-a=val]',box).disabled=true;finish(ok,q.x)};
}

/* ===================== INTRO ===================== */
VIEWS.intro={html(){return `${mhead('intro','Docker emballe une application avec tout ce dont elle a besoin (runtime, bibliothèques, configuration) dans une <b>image</b>, puis l\'exécute comme un <b>container</b> isolé, identique sur votre PC, en CI et en production.')}
 ${sec('Le problème : « Ça marche sur ma machine »',`<div class="split"><div class="card"><div class="tabs" id="wom-tabs"><button class="on" data-k="0" type="button">Sans Docker</button><button data-k="1" type="button">Avec Docker</button></div><div id="wom" style="margin-top:12px"></div></div>
  <div class="card"><h3>Ce que Docker change</h3><ul class="clean"><li>L'environnement devient un <b>artefact versionné</b> (l'image), plus une liste d'instructions à suivre à la main.</li><li>Un nouveau développeur lance le projet en une commande.</li><li>La CI teste exactement ce qui partira en production.</li></ul>${ana('Avant les conteneurs maritimes, chaque port chargeait les marchandises à sa façon. Le conteneur standard a rendu le transport identique partout. Docker fait la même chose pour le logiciel.')}</div></div>`)}
 ${sec('Machine virtuelle vs container','<p class="muted">Cliquez sur une couche pour voir son rôle.</p><div class="split"><div class="grid g2"><div><h3 style="margin-bottom:8px">Machine virtuelle</h3><div class="stack" id="vm-stack"></div></div><div><h3 style="margin-bottom:8px">Container</h3><div class="stack" id="ct-stack"></div></div></div><div class="info-panel" id="layer-info"><h3>Choisissez une couche</h3><p class="muted">La différence clé : chaque VM embarque un OS invité complet ; les containers partagent le noyau de l\'hôte.</p></div></div>')}
 ${sec('Comparer les ressources',`<div class="card"><div class="row between"><label for="nb-apps"><b>Nombre d'applications : <span id="nb-v">5</span></b></label><span class="small muted">ordres de grandeur indicatifs, variables selon les applications</span></div><input type="range" id="nb-apps" min="1" max="20" value="5" style="width:100%;accent-color:var(--docker)"><div id="res-cmp" class="grid g2" style="margin-top:12px"></div></div>`)}
 ${sec('Du code au container connecté',`<div id="intro-step"></div>`,'ANIMATION')}
 ${sec('Docker, Docker Compose et Kubernetes',`<div class="grid g3"><div class="card"><h3>Docker</h3><p class="muted small">Construit des images et lance des containers sur <b>une</b> machine.</p></div><div class="card"><h3>Docker Compose</h3><p class="muted small">Décrit et lance <b>plusieurs</b> containers liés sur une machine (dev, petits serveurs).</p></div><div class="card"><h3>Kubernetes</h3><p class="muted small">Orchestre des containers sur <b>un cluster</b> de machines : scaling, auto-réparation, déploiements progressifs.</p></div></div>
  <div class="grid g2"><div class="card"><h3>Pourquoi les développeurs l'utilisent</h3><ul class="clean"><li>Environnement prêt en une commande</li><li>Plusieurs versions de PostgreSQL ou Node côte à côte</li><li>Tests sur l'image réellement déployée</li></ul></div><div class="card"><h3>Pourquoi les entreprises l'utilisent</h3><ul class="clean"><li>Déploiements reproductibles et rollback rapide</li><li>Meilleure densité de serveurs</li><li>Standard pour la CI/CD et le cloud (ECS, Kubernetes)</li></ul></div>
  <div class="card"><h3>Avantages</h3><ul class="clean"><li>Portabilité</li><li>Démarrage en secondes</li><li>Isolation des dépendances</li><li>Images versionnées</li></ul></div><div class="card"><h3>Limites</h3><ul class="clean"><li>Isolation plus faible qu'une VM (noyau partagé)</li><li>Données persistantes à gérer (volumes)</li><li>Images Linux sur noyau Linux : sous Windows/macOS, Docker Desktop utilise une VM légère</li><li>Ne remplace ni les tests ni la sécurité applicative</li></ul></div></div>`)}`},

  $('#nb-apps').oninput=upd;upd();

   <g data-s="1"><path d="M138 158 h40" stroke="#3fdcef" stroke-width="2" marker-end="url(#ar)"/><text x="158" y="150" text-anchor="middle" font-size="9" fill="#8fa6c4">build</text>${[0,1,2,3].map(k=>`<rect x="186" y="${176-k*18}" width="110" height="16" rx="4" fill="${['#1a2333','#183052','#1b4f86','#1b74c2'][k]}" stroke="#28497a"/>`).join('')}<text x="241" y="104" text-anchor="middle" font-size="11" font-weight="600">Image mon-app:1.0</text><text x="241" y="210" text-anchor="middle" font-size="9" fill="#8fa6c4">couches en lecture seule</text></g>

  Stepper($('#intro-step'),{sceneHtml:svg,scene:fadeScene,steps:[

/* ===================== IMAGES & CONTAINERS ===================== */
VIEWS.images={html(){return `${mhead('images','Une <b>image</b> est un modèle immuable ; un <b>container</b> est une instance vivante de ce modèle, avec sa propre couche inscriptible.')}
 ${sec('Image vs container',`<div class="grid g2"><div class="card"><h3>Image</h3><ul class="clean"><li>Lecture seule, immuable</li><li>Composée de couches partagées</li><li>Identifiée par nom:tag et digest sha256</li><li>Stockée localement ou dans un registre</li></ul></div><div class="card"><h3>Container</h3><ul class="clean"><li>Processus isolé en cours d'exécution (ou arrêté)</li><li>Couche inscriptible propre, perdue à la suppression</li><li>A un état : created, running, paused, exited</li><li>Plusieurs containers par image</li></ul></div></div>${ana('L\'image est le moule à gâteau, le container est le gâteau. On peut faire 10 gâteaux avec un moule ; croquer un gâteau ne modifie pas le moule.')}`)}
 ${sec('Les couches','<div class="split"><div class="stack" id="lay"></div><div class="info-panel" id="lay-info"><h3>Copy-on-write</h3><p class="muted">Cliquez sur une couche. Quand un container modifie un fichier d\'une couche d\'image, Docker le copie d\'abord dans la couche inscriptible du container : l\'image reste intacte.</p></div></div>')}
 ${sec('Cycle de vie d\'un container',`<p class="muted">Appliquez des commandes et observez l'état. Les actions impossibles renvoient l'erreur réelle de Docker.</p><div class="card"><div id="lc-svg" class="diagram"></div><div class="row" style="margin-top:12px">${['create','start','pause','unpause','stop','kill','restart','rm'].map(c=>`<button class="btn sm" data-lc="${c}" type="button">docker ${c}</button>`).join('')}<button class="btn sm ghost" data-lc="reset" type="button">Recommencer</button></div><div id="lc-msg" class="small" style="margin-top:10px"></div></div>`,SIM)}

/* ===================== EXPLORATEUR ===================== */
function explainCmd(line){
  const a=tokenize(line.replace(/\\\s*\n/g,' '));const out=[];if(!a.length)return out;
  out.push({t:a[0],k:'cmd',d:a[0]==='docker'?'outil en ligne de commande qui envoie la requête au daemon Docker':a[0]==='kubectl'?'client Kubernetes':a[0]==='aws'?'AWS CLI':'commande'});
  let i=1;let sub=a[1];
  if(['volume','network','system','compose','image','container','scout'].includes(sub)&&a[2]&&!a[2].startsWith('-')){out.push({t:sub,k:'cmd',d:SUBCMDS[sub]});out.push({t:a[2],k:'cmd',d:SUBCMDS[a[2]]||'sous-commande'});i=3;sub=a[2]}
  else if(sub){out.push({t:sub,k:'cmd',d:SUBCMDS[sub]||'sous-commande'});i=2}
  let pos=0;const isRun=['run','create'].includes(sub);let imgSeen=false;
  for(;i<a.length;i++){const x=a[i];
    if(imgSeen){out.push({t:a.slice(i).join(' '),k:'arg',d:'commande exécutée DANS le container à la place du CMD par défaut de l\'image'});break}
    if(x.startsWith('-')&&x.length>1){let f=x,val=null;if(x.includes('=')&&x.startsWith('--')){f=x.split('=')[0];val=x.slice(f.length+1)}
      const ctx=(FLAG_CTX[sub]||{})[f];const info=FLAGS[f];let d=ctx||(info?info[1]+(info[0]?` (${info[0]})`:''):'option');
      if(/^-[a-z]{2,}$/.test(f)&&!info){d=[...f.slice(1)].map(c=>{const fi=FLAGS['-'+c];return`-${c} : ${fi?fi[1]:'option'}`}).join(' · ')}
      out.push({t:f,k:'flag',d});
      const takes=info&&info[2]||(sub==='build'&&(f==='-t'||f==='-f'))||(f==='-f'&&sub==='compose');
      if(takes){const v=val!==null?val:a[++i];if(v!==undefined){let vd='valeur de l\'option';
        if(f==='-p'||f==='--publish'){const m=v.split(':');vd=m.length>=2?`port ${m[m.length-2]} de la machine HÔTE → port ${m[m.length-1]} du CONTAINER (http://localhost:${m[m.length-2]})`:`port ${v} du container publié sur un port aléatoire de l'hôte`}
        else if(f==='-v'||f==='--volume'){const [s,t]=v.split(':');vd=/^[.\/~$]/.test(s)?`bind mount : dossier ${s} de l'hôte monté sur ${t}`:`volume nommé « ${s} » monté sur ${t} (persiste après suppression du container)`}
        else if(f==='--name')vd=`nom du container : utilisable à la place de l'ID dans les autres commandes`;
        else if(f==='-e'||f==='--env')vd=`variable ${v.split('=')[0]} = ${v.split('=').slice(1).join('=')||'(valeur reprise de l\'environnement hôte)'}`;
        else if(f==='-t'&&sub==='build')vd=`nom:tag de l'image produite`;
        out.push({t:v,k:'val',d:vd})}}
      continue}
    if(isRun&&!imgSeen){out.push({t:x,k:'img',d:`image utilisée ; ${x.includes(':')?'tag '+x.split(':').pop():'sans tag, Docker utilise « latest »'} ; téléchargée automatiquement si absente`});imgSeen=true;continue}
    if(sub==='build'&&(x==='.'||x.startsWith('./')||x.startsWith('/'))){out.push({t:x,k:'arg',d:'contexte de build : dossier envoyé au builder (filtré par .dockerignore)'});continue}
    pos++;out.push({t:x,k:'arg',d:sub==='tag'?(pos===1?'image source':'nouveau nom (registre/namespace/dépôt:tag)'):sub==='cp'?(pos===1?'source':'destination (container:chemin)'):(sub==='exec'?(pos===1?'container cible':'commande à exécuter'):'nom ou ID de la ressource ciblée')})}
  return out}

/* ===================== DOCKERFILE ===================== */
function lintDockerfile(src){
  const out=[];const lines=src.split('\n');let instr=[];let cont=false;
  lines.forEach((l,i)=>{const t=l.trim();if(cont){cont=t.endsWith('\\');instr[instr.length-1].txt+=' '+t;return}if(!t||t.startsWith('#'))return;const m=t.match(/^([A-Za-z]+)\s*(.*)$/);if(!m)return;instr.push({n:i+1,k:m[1].toUpperCase(),txt:m[2],raw:t});cont=t.endsWith('\\')});
  const add=(n,lvl,msg)=>out.push({n,lvl,msg});
  if(!instr.length){add(1,'err','Dockerfile vide.');return out}
  const first=instr.find(x=>x.k!=='ARG');if(!first||first.k!=='FROM')add(first?first.n:1,'err','La première instruction (hors ARG) doit être FROM.');
  instr.forEach(x=>{if(!INSTR[x.k]&&!['SHELL','ONBUILD','STOPSIGNAL','MAINTAINER'].includes(x.k))add(x.n,'err',`Instruction inconnue : ${x.k}`);
   if(x.k==='FROM'){const img=x.txt.split(/\s+/).filter(s=>!s.startsWith('--'))[0]||'';if(!img.includes(':')&&!img.includes('@')&&!/^\$/.test(img)&&!instr.some(y=>y.k==='FROM'&&y.txt.includes(' AS '+img)))add(x.n,'warn',`${img} sans tag = latest : épinglez une version (ex. ${img}:x.y).`);else if(/:latest\b/.test(img))add(x.n,'warn','Tag latest : build non reproductible.')}
   if(x.k==='ADD'&&!/\.(tar|tar\.gz|tgz|tar\.xz)\b/.test(x.txt)&&!/^https?:/.test(x.txt))add(x.n,'warn','Utilisez COPY : ADD a des comportements implicites (extraction, URL).');
   if(x.k==='RUN'&&/^cd\s/.test(x.txt)&&!x.txt.includes('&&'))add(x.n,'warn','RUN cd ne persiste pas : utilisez WORKDIR.');
   if(x.k==='RUN'&&/apt-get update/.test(x.txt)&&!/apt-get install/.test(x.txt))add(x.n,'warn','apt-get update seul : à combiner avec install dans le même RUN (sinon cache obsolète).');
   if(x.k==='RUN'&&/apt-get install/.test(x.txt)&&!/rm -rf \/var\/lib\/apt\/lists/.test(x.txt))add(x.n,'info','Nettoyez /var/lib/apt/lists dans le même RUN pour alléger la couche.');
   if(x.k==='RUN'&&/pip install/.test(x.txt)&&!/--no-cache-dir/.test(x.txt))add(x.n,'info','pip install --no-cache-dir évite de stocker le cache dans l\'image.');
   if((x.k==='ENV'||x.k==='ARG')&&/(PASSWORD|SECRET|TOKEN|API_?KEY|PRIVATE)/i.test(x.txt)&&/=\S/.test(x.txt))add(x.n,'err','Secret dans l\'image : visible avec docker history / inspect. Injectez-le à l\'exécution.');
   if(x.k==='CMD'&&!x.txt.trim().startsWith('['))add(x.n,'warn','Forme shell : PID 1 = /bin/sh, SIGTERM mal transmis. Préférez CMD ["exe", "arg"].');
   if(x.k==='EXPOSE'&&/^(22|3389)\b/.test(x.txt))add(x.n,'warn','Exposer SSH/RDP dans un container est un anti-modèle.')});
  const lastFrom=instr.map(x=>x.k).lastIndexOf('FROM');const finalStage=instr.slice(lastFrom);
  const users=finalStage.filter(x=>x.k==='USER');if(!users.length){if(!/nginx|distroless|nonroot/.test(finalStage[0].txt))add(finalStage[finalStage.length-1].n,'warn','Pas d\'instruction USER dans l\'étape finale : le container tourne en root.')}else if(/^(root|0)$/.test(users[users.length-1].txt.trim()))add(users[users.length-1].n,'warn','La dernière instruction USER est root.');
  const copyAll=finalStage.findIndex(x=>x.k==='COPY'&&/^\.\s+\.?/.test(x.txt.replace(/--\S+\s+/g,'')));const inst=finalStage.findIndex(x=>x.k==='RUN'&&/(pip|npm|yarn|pnpm|dotnet restore|mvn|mvnw|go mod)/.test(x.txt));
  if(copyAll>=0&&inst>copyAll)add(finalStage[copyAll].n,'warn','COPY . . avant l\'installation des dépendances : chaque modification du code réinstalle tout. Copiez d\'abord le fichier de dépendances.');
  if(!instr.some(x=>x.k==='HEALTHCHECK'))add(instr[instr.length-1].n,'info','Pas de HEALTHCHECK (facultatif : sur ECS/Kubernetes, la santé est souvent vérifiée par l\'orchestrateur).');
  if(!instr.some(x=>x.k==='EXPOSE'))add(instr[instr.length-1].n,'info','EXPOSE absent : documentez le port écouté.');
  return out.sort((a,b)=>a.n-b.n)}
VIEWS.dockerfile={html(){return `${mhead('dockerfile','Le Dockerfile est la recette de votre image. Chaque instruction produit une couche ; leur ordre décide de l\'efficacité du cache et de la taille finale.')}
 ${sec('Éditeur interactif','<div class="tabs" id="df-tabs">'+Object.entries(DF_EXAMPLES).map(([k,v],i)=>`<button class="${i===0?'on':''}" data-k="${k}" type="button">${v.t}</button>`).join('')+`</div>
  <div class="split"><div style="display:grid;gap:8px;min-width:0"><label class="small muted" for="df-src">Modifiez le Dockerfile, l'analyse se met à jour. Cliquez une ligne à droite pour son explication.</label><textarea id="df-src" rows="16" spellcheck="false"></textarea><div class="row"><button class="btn sm" id="df-copy" type="button">Copier</button><span id="df-score" class="small"></span></div></div>
  <div style="display:grid;gap:10px;min-width:0"><div class="editor"><div class="lines" id="df-lines"></div></div><div class="info-panel" id="df-info"><h3>Explication ligne par ligne</h3><p class="muted">Cliquez sur une ligne.</p></div></div></div>
  <div class="card"><h3>Analyse (linter pédagogique)</h3><div id="df-lint" class="grid" style="gap:6px;margin-top:8px"></div></div>`,'ÉDITEUR')}
 ${sec('Build animé et cache',`<div class="card" style="display:grid;gap:12px"><p class="muted small">Dockerfile Python simple. Choisissez ce que vous avez modifié depuis le dernier build, puis lancez la construction.</p>
  <div class="row" id="cache-opt">${[['first','Premier build'],['none','Rien modifié'],['code','Modifié app.py'],['req','Modifié requirements.txt'],['base','Nouvelle image de base']].map((o,i)=>`<label class="chk"><input type="radio" name="chg" value="${o[0]}" ${i===0?'checked':''}> ${o[1]}</label>`).join('')}</div>

  <div class="split"><div class="stack" id="build-stack"></div><div class="info-panel" id="build-info"><h3>Règle du cache</h3><p class="muted">Docker réutilise une couche si l'instruction ET ses fichiers d'entrée sont identiques. Dès qu'une couche est reconstruite, <b>toutes les suivantes</b> le sont aussi.</p></div></div></div>`,'ANIMATION')}
 ${sec('Référence des instructions',`<div class="grid g3" id="instr-grid">${Object.entries(INSTR).map(([k,v])=>`<details class="card"><summary style="cursor:pointer"><b class="mono" style="color:var(--docker)">${k}</b> <span class="muted small">— ${esc(v.d)}</span></summary><div style="display:grid;gap:6px;margin-top:8px;font-size:.88rem"><p><b>Fonctionnement :</b> ${esc(v.how)}</p>${codeBlock(v.ex,'dockerfile')}<p><span style="color:var(--ok)">✓</span> ${esc(v.good)}</p>${v.bad?`<p><span style="color:var(--err)">✗</span> ${esc(v.bad)}</p>`:''}</div></details>`).join('')}</div>`)}
 ${sec('Images légères, Alpine vs Debian, multi-stage',`<div class="grid g2"><div class="card"><h3>Tailles typiques (indicatives)</h3><div class="tbl" style="margin-top:8px"><table style="min-width:0"><tr><th>Image</th><th>Taille</th><th>Usage</th></tr><tr><td class="mono">python:3.12</td><td>~1 Go</td><td>Outils de compilation inclus</td></tr><tr><td class="mono">python:3.12-slim</td><td>~125 Mo</td><td>Le bon défaut</td></tr><tr><td class="mono">python:3.12-alpine</td><td>~50 Mo</td><td>Très léger, attention à musl</td></tr><tr><td class="mono">gcr.io/distroless/…</td><td>très petit</td><td>Pas de shell : surface minimale</td></tr></table></div></div>
  <div class="card"><h3>Alpine ou Debian ?</h3><ul class="clean"><li><b>Alpine</b> : musl libc et busybox, très petite. Certaines roues Python ou binaires précompilés pour glibc ne fonctionnent pas ou doivent être compilés (build plus long).</li><li><b>Debian slim</b> : glibc, compatibilité maximale, un peu plus grande.</li><li>Règle : slim par défaut ; Alpine si vous mesurez un vrai gain et que tout fonctionne.</li></ul></div>
  <div class="card"><h3>Multi-stage build</h3><p class="small muted">Une étape lourde compile, l'image finale ne garde que le résultat. Voir les onglets React, ASP.NET et Spring.</p>${codeBlock('FROM node:22-alpine AS build\n…\nRUN npm run build\n\nFROM nginx:1.27-alpine\nCOPY --from=build /app/dist /usr/share/nginx/html','dockerfile')}</div>
  <div class="card"><h3>.dockerignore</h3><p class="small muted">Exclut des fichiers du contexte : build plus rapide, pas de secrets ni de .git dans l'image.</p>${codeBlock('.git\n.venv\nnode_modules\n__pycache__\n*.log\n.env\nDockerfile*\ncompose*.yaml','bash','.dockerignore')}</div></div>
  <div class="card"><h3>Optimisations de sécurité</h3><ul class="clean"><li>Base minimale et épinglée, mise à jour régulièrement</li><li>Utilisateur non-root (<span class="inline">USER</span>)</li><li>Aucun secret dans ENV/ARG ; secrets de build via <span class="inline">RUN --mount=type=secret,id=npmrc …</span></li><li>Scanner l'image (Docker Scout, Trivy) dans la CI</li><li>Ne pas installer d'outils inutiles (vim, curl, sudo)</li></ul></div>`)}`},
 mount(root){
  const ta=$('#df-src');let selLine=null;
  const upd=()=>{const src=ta.value;const lint=lintDockerfile(src);const byLine={};lint.forEach(l=>(byLine[l.n]=byLine[l.n]||[]).push(l));
   $('#df-lines').innerHTML=src.split('\n').map((l,i)=>`<div class="ln ${byLine[i+1]&&byLine[i+1].some(x=>x.lvl!=='info')?'warnl':''} ${selLine===i?'sel':''}" data-i="${i}"><span class="no">${i+1}</span><span>${hlLine(l,'dockerfile')||' '}</span></div>`).join('');
   $$('#df-lines .ln').forEach(el=>el.onclick=()=>{selLine=+el.dataset.i;$$('#df-lines .ln').forEach(x=>x.classList.toggle('sel',x===el));const line=src.split('\n')[selLine].trim();const k=(line.match(/^([A-Za-z]+)/)||[])[1];const I=k&&INSTR[k.toUpperCase()];const ls=byLine[selLine+1]||[];
    $('#df-info').innerHTML=!line?'<h3>Ligne vide</h3><p class="muted">Sans effet.</p>':line.startsWith('#')?`<h3>Commentaire</h3><p>${line.startsWith('# syntax=')?'Directive de parseur : choisit la version de la syntaxe Dockerfile (BuildKit).':'Ignoré par le build.'}</p>`:I?`<h3><span class="mono">${k.toUpperCase()}</span></h3><p>${esc(I.d)}</p><p class="small muted" style="margin-top:6px">${esc(I.how)}</p><p class="small" style="margin-top:6px"><span style="color:var(--ok)">✓</span> ${esc(I.good)}</p>${ls.map(x=>`<div class="${x.lvl==='err'?'errbox':x.lvl==='warn'?'warnbox':'okbox'}" style="margin-top:6px">${esc(x.msg)}</div>`).join('')}`:line.endsWith('\\')||/^\S+=/.test(line)?'<h3>Suite d\'instruction</h3><p class="muted">Continuation de la ligne précédente (\\ en fin de ligne).</p>':'<h3>Ligne non reconnue</h3>'});
   const errs=lint.filter(x=>x.lvl==='err').length,warns=lint.filter(x=>x.lvl==='warn').length;const score=Math.max(0,100-errs*25-warns*10-lint.filter(x=>x.lvl==='info').length*2);
   $('#df-score').innerHTML=`Score qualité : <b style="color:${score>=80?'var(--ok)':score>=50?'var(--warn)':'var(--err)'}">${score}/100</b>`;
   $('#df-lint').innerHTML=lint.length?lint.map(x=>`<div class="${x.lvl==='err'?'errbox':x.lvl==='warn'?'warnbox':'okbox'}"><span class="mono small">L${x.n}</span> · ${esc(x.msg)}</div>`).join(''):'<div class="okbox">Aucun problème détecté.</div>'};
  const load=k=>{ta.value=DF_EXAMPLES[k].df;selLine=null;upd();$$('#df-tabs button').forEach(b=>b.classList.toggle('on',b.dataset.k===k))};
  $$('#df-tabs button').forEach(b=>b.onclick=()=>load(b.dataset.k));ta.oninput=upd;$('#df-copy').onclick=e=>copyText(ta.value,e.target);load('base');
  const LAY=[['FROM python:3.12-slim','Layer 1 · image de base',['base']],['WORKDIR /app','Layer 2 · dossier de travail',['base']],['COPY requirements.txt .','Layer 3 · fichier de dépendances',['base','req']],['RUN pip install --no-cache-dir -r requirements.txt','Layer 4 · dépendances (lent)',['base','req']],['COPY . .','Layer 5 · code de l\'application',['base','req','code']],['EXPOSE 8000','Métadonnée · port',['base','req','code']],['CMD ["python", "app.py"]','Métadonnée · commande',['base','req','code']]];
  const DUR=[1.8,0.1,0.1,9.6,0.2,0,0];let busy=false;
  const drawStack=(n,stat)=>{$('#build-stack').innerHTML=LAY.slice(0,n).map((l,i)=>`<div class="layer new ${stat[i]==='CACHED'?'cached':'rebuilt'}"><span><span class="mono small">${esc(l[0])}</span><br><span class="small muted">${l[1]}</span></span><span class="pill ${stat[i]==='CACHED'?'ok':'warn'}">${stat[i]}</span></div>`).join('')};
  $('#build-go').onclick=async()=>{if(busy)return;busy=true;const chg=$('input[name=chg]:checked',root).value;
   const stat=LAY.map((l,i)=>chg==='first'?'BUILD':chg==='none'?'CACHED':l[2].includes(chg)?'BUILD':'CACHED');
   // une couche invalidée invalide la suite
   let inv=false;for(let i=0;i<stat.length;i++){if(stat[i]==='BUILD')inv=true;else if(inv)stat[i]='BUILD'}
   let t=0;for(let i=0;i<LAY.length;i++){drawStack(i+1,stat);if(stat[i]==='BUILD')t+=DUR[i];$('#build-time').textContent=`temps simulé : ${t.toFixed(1)} s`;await sleep(reduceMotion()?0:(stat[i]==='BUILD'?Math.max(250,DUR[i]*90):160))}
   $('#build-stack').insertAdjacentHTML('beforeend',`<div class="layer eng new"><span><b>Image finale mon-app:latest</b><br><span class="small">→ prête pour docker run</span></span><span class="pill ok">OK</span></div>`);
   const msgs={first:'Premier build : tout est construit, l\'installation des dépendances domine le temps.',none:'Rien n\'a changé : toutes les couches viennent du cache, le build est quasi instantané.',code:'Seul le code a changé : les dépendances (couche 4) sont réutilisées. C\'est pour ça qu\'on copie requirements.txt avant le code.',req:'Le fichier de dépendances a changé : la couche 3 est invalidée, donc 4 et 5 sont reconstruites.',base:'Nouvelle image de base : tout est reconstruit. Faites-le régulièrement pour les correctifs de sécurité.'};
   $('#build-info').innerHTML=`<h3>Résultat</h3><p>${msgs[chg]}</p><p class="small muted" style="margin-top:6px">${stat.filter(s=>s==='CACHED').length} couche(s) en cache · ${stat.filter(s=>s==='BUILD').length} reconstruite(s).</p>`;busy=false};
 }};
