VIEWS.compose={html(){return `${mhead('compose','Docker Compose décrit une application multi-containers dans un fichier YAML : services, ports, variables, volumes, réseaux et dépendances. Une commande démarre tout.')}
 ${ana('Compose est la partition d\'un orchestre : chaque musicien (service) sait quand entrer (depends_on), avec qui jouer (networks) et où ranger ses partitions (volumes).')}
 ${sec('Laboratoire Compose',`<div class="row">${SIM}<span class="small muted">Le démarrage est simulé. Le fichier édité ici est aussi celui qu'utilise <span class="inline">docker compose</span> dans le Command Center.</span></div>
  <div class="split"><div style="display:grid;gap:8px;min-width:0"><label class="small muted" for="cp-src">compose.yaml — modifiez les ports, ajoutez des services ou des variables.</label><textarea id="cp-src" rows="22" spellcheck="false"></textarea>
   <div class="row"><button class="btn primary" id="cp-up" type="button">▶ docker compose up -d</button><button class="btn" id="cp-down" type="button">■ down</button><button class="btn" id="cp-restart" type="button">↻ restart</button><button class="btn ghost" id="cp-add" type="button">+ Ajouter un service</button><button class="btn ghost" id="cp-reset" type="button">Fichier initial</button></div><div id="cp-val"></div></div>
   <div style="display:grid;gap:10px;min-width:0"><div class="diagram" id="cp-graph"></div><div class="info-panel" id="cp-info"><h3>Service</h3><p class="muted">Cliquez un service du schéma pour voir sa configuration.</p></div></div></div>
  <div class="term"><div class="term-h"><div class="lights"><i></i><i></i><i></i></div><div class="ttl">docker compose logs -f (simulé)</div></div><div class="term-out" id="cp-logs" style="height:200px"></div></div>`,'LAB')}
 ${sec('Commandes Compose',`<div class="tbl"><table><tr><th>Commande</th><th>Rôle</th><th>Attention</th></tr>${COMMANDS.filter(c=>c.cat==='Compose').map(c=>`<tr><td class="mono" style="white-space:nowrap">${esc(c.c)}</td><td>${esc(c.d)}</td><td class="small muted">${esc(c.err[0]||c.tip||'')}</td></tr>`).join('')}<tr><td class="mono">docker compose up -d</td><td>Démarre en arrière-plan</td><td class="small muted">Relancez-le après chaque modification du fichier</td></tr><tr><td class="mono">docker compose down -v</td><td>Arrête et supprime aussi les volumes</td><td class="small" style="color:var(--err)">Efface les données</td></tr></table></div>`)}
 ${sec('Bonnes pratiques',`<div class="grid g2"><div class="card"><ul class="clean"><li>Nom du fichier : <span class="inline">compose.yaml</span> ; la clé <span class="inline">version</span> est obsolète.</li><li>Entre containers : nom du service, jamais localhost.</li><li><span class="inline">depends_on</span> + <span class="inline">condition: service_healthy</span> pour attendre une base prête.</li></ul></div><div class="card"><ul class="clean"><li>Ports entre guillemets : <span class="inline">"5432:5432"</span>.</li><li>Ne publiez que le point d'entrée (nginx) ; base et cache restent internes.</li><li>Secrets : fichier <span class="inline">.env</span> non versionné ou section <span class="inline">secrets:</span>.</li></ul></div></div>`)}`},
 mount(root){
  const ta=$('#cp-src');ta.value=GSIM.compose.src||COMPOSE_DEFAULT;let state={};let v=null;let timers=[];
  const logs=$('#cp-logs');const log=(svc,t,c)=>{const d=document.createElement('div');d.textContent=`${(svc+'-1').padEnd(14)}| ${t}`;if(c)d.className='l-'+c;logs.appendChild(d);logs.scrollTop=logs.scrollHeight};
  onLeave(()=>timers.forEach(clearTimeout));
  const COLORS=['#2496ED','#a594f9','#34d399','#f5b93a'];
  function graph(){if(!v||!v.svcs.length){$('#cp-graph').innerHTML='<p class="muted small" style="padding:20px">Aucun service valide à afficher.</p>';return}
   const depth={};const dd=n=>{if(depth[n]!=null)return depth[n];depth[n]=0;const s=v.svcs.find(x=>x.name===n);depth[n]=s&&s.deps.length?Math.max(...s.deps.map(d=>v.svcs.some(x=>x.name===d)?dd(d)+1:0)):0;return depth[n]};v.svcs.forEach(s=>dd(s.name));
   const maxD=Math.max(...Object.values(depth));const cols={};v.svcs.forEach(s=>{const c=maxD-depth[s.name];(cols[c]=cols[c]||[]).push(s)});
   const nc=maxD+1;const W=640;const colW=W/nc;const pos={};const H=Math.max(300,Math.max(...Object.values(cols).map(c=>c.length))*96+60);
   Object.entries(cols).forEach(([c,arr])=>arr.forEach((s,i)=>{pos[s.name]={x:colW*c+colW/2-70,y:50+i*(H-60)/arr.length+((H-60)/arr.length-70)/2}}));
   const netNames=[...new Set(v.svcs.flatMap(s=>s.nets))];
   let svg=`<svg viewBox="0 0 ${W} ${H}"><defs><marker id="a4" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" fill="#3fdcef"/></marker></defs>`;
   v.svcs.forEach(s=>s.deps.forEach(d=>{if(!pos[d])return;const a=pos[s.name],b=pos[d];svg+=`<path class="flowline ${state[s.name]==='running'?'act':''}" d="M${a.x+140} ${a.y+35} C ${a.x+170} ${a.y+35}, ${b.x-30} ${b.y+35}, ${b.x} ${b.y+35}" marker-end="url(#a4)"/>`}));
   v.svcs.forEach(s=>{const p=pos[s.name];const st=state[s.name]||'stopped';svg+=`<g class="clk" data-s="${esc(s.name)}" tabindex="0" role="button"><rect x="${p.x}" y="${p.y}" width="140" height="70" rx="10" fill="${st==='running'?'#0e3b4a':st==='starting'?'#2b2a12':'#11284a'}" stroke="${st==='running'?'#34d399':st==='starting'?'#f5b93a':'#28497a'}" stroke-width="1.5"/><circle cx="${p.x+12}" cy="${p.y+14}" r="4" fill="${st==='running'?'#34d399':st==='starting'?'#f5b93a':'#5f7799'}"/><text x="${p.x+70}" y="${p.y+22}" text-anchor="middle" font-size="12" font-weight="700">${esc(s.name)}</text><text x="${p.x+70}" y="${p.y+38}" text-anchor="middle" font-size="9" fill="#8fa6c4">${esc((s.image||'build: '+s.build).slice(0,24))}</text>
    ${s.nets.map((n,k)=>`<rect x="${p.x+8+k*44}" y="${p.y+47}" width="40" height="14" rx="7" fill="${COLORS[netNames.indexOf(n)%4]}" opacity=".25"/><text x="${p.x+28+k*44}" y="${p.y+57}" text-anchor="middle" font-size="8">${esc(n.slice(0,7))}</text>`).join('')}</g>`;
    s.ports.filter(x=>x.h).forEach((pt,k)=>{svg+=`<rect x="${p.x+20+k*58}" y="${p.y-22}" width="54" height="16" rx="4" fill="#2496ED"/><text x="${p.x+47+k*58}" y="${p.y-11}" text-anchor="middle" font-size="9" font-family="JetBrains Mono,monospace">:${pt.h}→${pt.c}</text>`});
    s.vols.forEach((vl,k)=>{svg+=`<g><ellipse cx="${p.x+150}" cy="${p.y+48+k*14}" rx="6" ry="3" fill="#a594f9"/><text x="${p.x+158}" y="${p.y+51+k*14}" font-size="8" fill="#a594f9">${esc(vl.src.slice(0,14))}</text></g>`})});
   svg+=`<text x="10" y="${H-10}" font-size="9" fill="#8fa6c4">→ depends_on · bleu : port publié sur l'hôte · violet : volume · pastilles : réseaux</text></svg>`;
   $('#cp-graph').innerHTML=svg;
   $$('#cp-graph .clk').forEach(g=>{const f=()=>{const s=v.svcs.find(x=>x.name===g.dataset.s);$('#cp-info').innerHTML=`<h3>${esc(s.name)}</h3><div class="explain-list"><div><code>source</code><span>${s.image?'image '+esc(s.image):'build depuis '+esc(s.build)}</span></div><div><code>ports</code><span>${s.ports.length?s.ports.map(p=>p.h?`hôte ${p.h} → container ${p.c}`:`${p.c} (port aléatoire)`).join(', '):'aucun : joignable seulement par les autres services'}</span></div><div><code>depends_on</code><span>${esc(s.deps.join(', ')||'—')}</span></div><div><code>networks</code><span>${esc(s.nets.join(', '))}</span></div><div><code>volumes</code><span>${s.vols.map(x=>esc(x.src+' → '+x.dst)).join('<br>')||'—'}</span></div><div><code>DNS</code><span>les autres services le joignent via <b>${esc(s.name)}</b>${s.ports[0]?':'+s.ports[0].c:''}</span></div><div><code>état</code><span>${state[s.name]||'arrêté'}</span></div></div>`};g.onclick=f;g.onkeydown=e=>{if(e.key==='Enter')f()}})}
  function validate(){GSIM.compose.src=ta.value;try{const doc=parseYAML(ta.value);v=validateCompose(doc)}catch(e){v={errs:[e.message],warns:[],svcs:[]}}
   $('#cp-val').innerHTML=v.errs.length?v.errs.map(e=>`<div class="errbox">${esc(e)}</div>`).join(''):`<div class="okbox">Fichier valide : ${v.svcs.length} services, ${v.vols?v.vols.length:0} volume(s), ${v.nets?v.nets.length:0} réseau(x) déclaré(s).</div>`+v.warns.map(w=>`<div class="warnbox" style="margin-top:6px">${esc(w)}</div>`).join('');
   Object.keys(state).forEach(k=>{if(!v.svcs.some(s=>s.name===k))delete state[k]});graph();return!v.errs.length}
  let deb;ta.oninput=()=>{clearTimeout(deb);deb=setTimeout(validate,300)};

  const INFO={internet:['Internet','Le seul point d\'entrée est le port 443 publié par nginx. Aucun autre service ne publie de port.'],nginx:['nginx (reverse proxy)','Termine TLS, sert / vers frontend et /api vers backend:8000 grâce au DNS interne. Membre du réseau front seulement.'],frontend:['frontend','Fichiers statiques. N\'a aucune raison de parler à la base : il n\'est pas sur le réseau back.'],backend:['backend','Seul service présent sur les DEUX réseaux : il reçoit les requêtes de nginx et parle à redis et database.'],redis:['redis','Cache, réseau back uniquement, aucun port publié.'],database:['database','Réseau back uniquement. Même si l\'attaquant compromet le frontend, il ne peut pas joindre la base.'],

    let extra='';if(/actions\/checkout/.test(line))extra='Clone le dépôt sur le runner : sans cette étape, le runner est vide.';else if(/setup-python/.test(line))extra='Installe la version de Python demandée (et peut mettre pip en cache).';else if(/docker build/.test(line))extra='Construit l\'image sur le runner (Docker est préinstallé sur ubuntu-latest).';else if(/docker push/.test(line))extra='Publie l\'image : nécessite une authentification préalable au registre.';else if(/\$\{\{\s*secrets\./.test(line))extra='Lit un secret chiffré du dépôt : masqué automatiquement dans les logs.';else if(/github\.sha/.test(line))extra='SHA complet du commit qui a déclenché le workflow.';else if(/GITHUB_OUTPUT/.test(line))extra='Déclare une sortie d\'étape réutilisable par les jobs suivants.';

   const cur=$('#ga-fail').value;$('#ga-fail').innerHTML='<option value="">aucun</option>'+v.jobs.flatMap(j=>j.steps.map((s,i)=>`<option value="${esc(j.name+'|'+i)}">${esc(j.name+' › '+s.name)}</option>`)).join('');$('#ga-fail').value=cur;

  let busy=false;
  $('#ga-run').onclick=async()=>{if(busy)return;upd();if(v.errs.length){toast('Le workflow contient des erreurs : GitHub refuserait de le lancer');return}busy=true;const log=$('#ga-log');log.textContent='';const fail=$('#ga-fail').value;const w=(t,c)=>{const d=document.createElement('div');d.textContent=t;if(c)d.className='l-'+c;log.appendChild(d);log.scrollTop=1e6};
   const res={};const order=[];const vis={};const visit=n=>{if(vis[n])return;vis[n]=1;(v.jobs.find(j=>j.name===n)||{needs:[]}).needs.forEach(visit);order.push(n)};v.jobs.forEach(j=>visit(j.name));

    for(let i=0;i<j.steps.length;i++){const s=j.steps[i];const el=$(`[data-st="${CSS.escape(jn+'|'+i)}"]`);if(!ok){el.textContent='– '+s.name;continue}el.textContent='◌ '+s.name;w(`▶ ${s.name}`);await sleep(reduceMotion()?30:550);if(!document.body.contains(log)){busy=false;return}
     if(fail===jn+'|'+i){ok=false;el.innerHTML=`<span style="color:var(--err)">✗ ${esc(s.name)}</span>`;w(s.run&&/test|pytest/.test(s.run)?'FAILED tests/test_app.py::test_health - AssertionError':s.uses?`Error: ${s.uses} failed`:`/home/runner/work/_temp/${hex(8)}.sh: line 1: exit code 1`,'err');w('Error: Process completed with exit code 1.','err')}
     else{el.innerHTML=`<span style="color:var(--ok)">✓ ${esc(s.name)}</span>`;if(s.uses)w(`  Run ${s.uses}`,'dim');if(s.run)String(s.run).split('\n').filter(Boolean).slice(0,4).forEach(l=>w('  $ '+l,'dim'));

    res[jn]=ok?'success':'failed';pill.textContent=res[jn];pill.className='pill '+(ok?'ok':'err');w('Complete job',ok?'ok':'err')}
   w(Object.values(res).every(r=>r==='success')?'\n✓ Workflow réussi':'\n✗ Workflow en échec : corrigez puis « Re-run jobs »',Object.values(res).every(r=>r==='success')?'ok':'err');$('#ga-run').textContent='↻ Re-run workflow';busy=false};

  <div class="row"><span class="small">Préréglages :</span><button class="btn sm" data-p="admin" type="button">AdministratorAccess (*)</button><button class="btn sm" data-p="ecrall" type="button">Services complets + 1 Deny</button><button class="btn sm" data-p="least" type="button">Moindre privilège</button><button class="btn sm ghost" id="st-add" type="button">+ Statement</button></div>
  <div id="st-rows" class="grid" style="gap:8px"></div>
  <div class="split"><div><b class="small">Policy JSON générée</b><div id="pol-json"></div></div><div><div class="row between"><b class="small">Évaluation des requêtes</b><span id="iam-score"></span></div><div class="tbl" style="margin-top:6px"><table style="min-width:0" id="iam-tbl"></table></div></div></div></div>`,'LAB')}
 ${sec('OIDC : GitHub Actions sans clé',`<div class="grid g2"><div class="card"><ol class="clean" style="padding-left:18px;display:grid;gap:6px"><li>Une seule fois : déclarer le fournisseur OIDC <span class="inline">token.actions.githubusercontent.com</span> dans IAM.</li><li>Créer un rôle dont la trust policy n'accepte QUE votre dépôt et votre branche.</li><li>Dans le workflow : <span class="inline">permissions: id-token: write</span>.</li><li>À chaque run, GitHub émet un jeton signé ; STS l'échange contre des identifiants valables environ 1 h.</li></ol></div><div>${codeBlock(DEPLOY_STEPS[7].code[1],'json','trust-policy.json')}</div></div>`)}`},
 mount(root){
  const svg=`<div class="diagram"><svg viewBox="0 0 640 300">${[['Développeur','MFA + IAM Identity Center','rôle Developer (8 h)','ECR · ECS · Logs',30],['GitHub Actions','jeton OIDC signé','STS AssumeRoleWithWebIdentity','ECR push · ECS deploy',125],['Instance EC2 / task ECS','profil d\'instance / rôle de task','identifiants auto-renouvelés','S3 · CloudWatch',220]].map((r,k)=>`<g data-s="${k*2}"><rect x="10" y="${r[4]}" width="130" height="52" rx="9" fill="#11284a" stroke="#28497a"/><text x="75" y="${r[4]+30}" text-anchor="middle" font-size="11" font-weight="600">${r[0]}</text><path d="M140 ${r[4]+26} h26" stroke="#3fdcef" stroke-width="2"/><rect x="166" y="${r[4]}" width="140" height="52" rx="9" fill="#2a2457" stroke="#a594f9"/><text x="236" y="${r[4]+30}" text-anchor="middle" font-size="9.5">${r[1]}</text></g><g data-s="${k*2+1}"><path d="M306 ${r[4]+26} h26" stroke="#3fdcef" stroke-width="2"/><rect x="332" y="${r[4]}" width="150" height="52" rx="9" fill="#183052" stroke="#2496ED"/><text x="407" y="${r[4]+30}" text-anchor="middle" font-size="9.5">${r[2]}</text><path d="M482 ${r[4]+26} h20" stroke="#3fdcef" stroke-width="2"/><rect x="502" y="${r[4]}" width="128" height="52" rx="9" fill="#0e3b4a" stroke="#34d399"/><text x="566" y="${r[4]+30}" text-anchor="middle" font-size="9.5">${r[3]}</text></g>`).join('')}</svg></div>`;
  Stepper($('#iam-actors'),{sceneHtml:svg,scene:fadeScene,steps:[{t:'Développeur : authentification',d:'Connexion via IAM Identity Center avec MFA. Pas d\'utilisateur IAM ni de clé permanente.'},{t:'Développeur : rôle temporaire',d:'aws configure sso puis le profil assume le rôle Developer : identifiants valables quelques heures.'},{t:'GitHub Actions : jeton OIDC',d:'Le runner demande à GitHub un jeton signé décrivant le dépôt, la branche et le workflow.'},{t:'GitHub Actions : échange STS',d:'STS vérifie la signature et la trust policy (aud + sub), puis renvoie des identifiants du rôle de déploiement.'},{t:'EC2 / ECS : rôle attaché',d:'Le rôle est attaché à l\'instance (profil) ou à la task ; le SDK récupère des identifiants via le service de métadonnées.'},{t:'EC2 / ECS : accès aux services',d:'L\'application appelle S3 ou CloudWatch sans aucune clé dans son code ni dans ses variables.'}]});
  let rows=JSON.parse(JSON.stringify(IAM_PRESETS.admin));
  const actionsOf=s=>[].concat(s.Action);
  const drawRows=()=>{$('#st-rows').innerHTML=rows.map((s,i)=>{const a=actionsOf(s)[0]||'*';const svc=a==='*'?'*':a.split(':')[0];const act=a==='*'?'*':a.split(':')[1];const multi=actionsOf(s).length>1;
    return`<div class="card" style="padding:10px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,130px),1fr));gap:8px;align-items:end"><label class="small">Effect<select data-i="${i}" data-f="eff"><option ${s.Effect==='Allow'?'selected':''}>Allow</option><option ${s.Effect==='Deny'?'selected':''}>Deny</option></select></label>
    <label class="small">Service<select data-i="${i}" data-f="svc">${Object.keys(IAM_ACTIONS).map(k=>`<option ${k===svc?'selected':''}>${k}</option>`).join('')}</select></label>
    <label class="small">Action${multi?` <span class="dim">(${actionsOf(s).length} actions)</span>`:''}<select data-i="${i}" data-f="act" ${multi?'disabled':''}>${(IAM_ACTIONS[svc]||['*']).map(k=>`<option ${k===act?'selected':''}>${k}</option>`).join('')}</select></label>
    <label class="small" style="grid-column:span 2">Resource<input type="text" class="mono" data-i="${i}" data-f="res" value="${esc([].concat(s.Resource).join(', '))}" id="res-${i}"></label><button class="btn sm danger" data-del="${i}" type="button">Retirer</button></div>`}).join('');
   $$('#st-rows [data-f]').forEach(el=>el.onchange=el.oninput=()=>{const s=rows[+el.dataset.i];const f=el.dataset.f;
    if(f==='eff')s.Effect=el.value;if(f==='svc'){s.Action=el.value==='*'?'*':el.value+':*';drawRows()}if(f==='act'){const svc=$(`[data-i="${el.dataset.i}"][data-f=svc]`).value;s.Action=svc==='*'?'*':svc+':'+el.value}if(f==='res')s.Resource=el.value.split(',').map(x=>x.trim()).filter(Boolean);evalAll()});
   $$('#st-rows [data-del]').forEach(b=>b.onclick=()=>{rows.splice(+b.dataset.del,1);drawRows()});evalAll()};
  const evalAll=()=>{const pol={Version:'2012-10-17',Statement:rows};$('#pol-json').innerHTML=codeBlock(JSON.stringify(pol,null,2),'json','policy.json');let good=0;
   $('#iam-tbl').innerHTML='<tr><th>Requête</th><th>Résultat</th><th>Attendu</th></tr>'+IAM_REQS.map(r=>{const res=iamEval(rows,r);const al=res==='allow';const ok=al===r.want;if(ok)good++;return`<tr><td><span class="small">${esc(r.d)}</span><br><span class="mono dim" style="font-size:.7rem">${esc(r.a)}</span></td><td><span class="pill ${al?'ok':'err'}">${al?'Allow':res==='deny-explicit'?'Deny explicite':'Refus implicite'}</span></td><td>${ok?'<span style="color:var(--ok)">✓</span>':'<span style="color:var(--err)">✗ '+(r.want?'devrait passer':'devrait être bloqué')+'</span>'}</td></tr>`}).join('');
   $('#iam-score').innerHTML=`<span class="pill ${good===IAM_REQS.length?'ok':good>=6?'warn':'err'}">${good}/${IAM_REQS.length}${good===IAM_REQS.length?' · moindre privilège atteint':''}</span>`};
  $$('[data-p]',root).forEach(b=>b.onclick=()=>{rows=JSON.parse(JSON.stringify(IAM_PRESETS[b.dataset.p]));drawRows()});
  $('#st-add').onclick=()=>{rows.push({Effect:'Allow',Action:'ecr:BatchGetImage',Resource:REPO});drawRows()};drawRows();
 }};

VIEWS.deploiement={html(){return `${mhead('deploiement','Projet fil rouge : une API containerisée déployée sur AWS avec GitHub Actions, ECR, ECS Fargate, IAM (OIDC), HTTPS, logs, monitoring et rollback. Quatorze étapes, chacune avec checklist et validation.')}
 <div class="warnbox">Ce guide décrit de <b>vraies</b> opérations AWS ${REAL}. Rien n'est déployé depuis cette page. Prévoyez un budget et supprimez les ressources à la fin.</div>
 <div class="card" style="display:grid;gap:10px"><div class="row between"><b>Avancement</b><span id="dp-pct" class="small tnum"></span></div><div class="meter"><i id="dp-bar"></i></div><div class="pipe" id="dp-map"></div></div>
 <div id="dp-step"></div>`},
 mount(root){
  let cur=0;const zones={local:'Local',github:'GitHub',aws:'AWS'};
  const chk=(i,k)=>!!Store.d.checks[`d${i}-${k}`];
  const stepDone=i=>DEPLOY_STEPS[i].chk.every((_,k)=>chk(i,k));
  const draw=()=>{const s=DEPLOY_STEPS[cur];const nd=DEPLOY_STEPS.filter((_,i)=>stepDone(i)).length;$('#dp-pct').textContent=`${nd}/14 étapes validées`;$('#dp-bar').style.width=(nd/14*100)+'%';
   $('#dp-map').innerHTML=DEPLOY_STEPS.map((x,i)=>`<div class="stage ${stepDone(i)?'success':i===cur?'running':''}" style="cursor:pointer" data-go="${i}"><div class="b">${stepDone(i)?'✓':i+1}</div><div class="lbl">${esc(x.t)}</div><div class="st">${zones[x.zone]}</div></div>`).join('');
   $$('#dp-map [data-go]').forEach(e=>e.onclick=()=>{cur=+e.dataset.go;draw()});
   $('#dp-step').innerHTML=`<section class="card" style="display:grid;gap:14px"><div class="row between"><div><div class="eyebrow">Étape ${cur+1} / 14 · ${zones[s.zone]}</div><h2>${esc(s.t)}</h2></div><span class="pill ${stepDone(cur)?'ok':''}">${stepDone(cur)?'validée':'à faire'}</span></div>
    <p>${esc(s.ex)}</p>${s.cmd?`<div><b class="small">Commandes</b>${codeBlock(s.cmd,'bash')}</div>`:''}${s.code?`<div><b class="small">Code</b>${codeBlock(s.code[1],langOf(s.code[0]),s.code[0])}</div>`:''}
    <div class="grid g2"><div><b class="small">Checklist</b><div class="grid" style="gap:6px;margin-top:6px">${s.chk.map((c,k)=>`<label class="chk"><input type="checkbox" data-k="${k}" id="dp-${cur}-${k}" ${chk(cur,k)?'checked':''}> ${esc(c)}</label>`).join('')}</div></div><div class="grid" style="gap:8px"><div class="errbox"><b>Erreurs courantes</b><ul class="clean">${s.err.map(e=>`<li>${esc(e)}</li>`).join('')}</ul></div><div class="okbox"><b>Validation · </b><span class="mono small">${esc(s.val)}</span></div></div></div>
    <div class="row between"><button class="btn" id="dp-prev" type="button" ${cur?'':'disabled'}>← Étape précédente</button><button class="btn primary" id="dp-next" type="button" ${cur<13?'':'disabled'}>Étape suivante →</button></div></section>`;
   $$('#dp-step input[type=checkbox]').forEach(c=>c.onchange=()=>{const key=`d${cur}-${c.dataset.k}`;if(c.checked)Store.d.checks[key]=1;else delete Store.d.checks[key];Store.save();draw()});
   $('#dp-prev').onclick=()=>{cur--;draw()};$('#dp-next').onclick=()=>{cur++;draw();$('#dp-step').scrollIntoView({behavior:'smooth'})}};
  draw();
 }};

VIEWS.securite={html(){return `${mhead('securite','Un container n\'est pas une frontière de sécurité absolue. La sécurité se construit en couches : image minimale et à jour, utilisateur non-root, secrets hors de l\'image, réseau minimal, droits minimaux.')}
 ${sec('Les risques',`<div class="grid g4">${[['Images vulnérables','Base obsolète ou paquets avec CVE connues.'],['Secrets exposés','Mot de passe dans ENV, dans Git ou dans les logs.'],['Containers root','Une faille applicative donne root dans le container, voire sur l\'hôte avec une mauvaise config.'],['Ports exposés','Base de données publiée sur 0.0.0.0.'],['Images non vérifiées','Image inconnue de Docker Hub contenant un mineur de cryptomonnaie.'],['Réseau mal configuré','Tous les services sur le même réseau, sans segmentation.'],['Permissions excessives','--privileged, docker.sock monté, rôle IAM *.']].map(r=>`<div class="card"><h3>${r[0]}</h3><p class="small muted">${r[1]}</p></div>`).join('')}</div>`)}
 ${sec('Bonnes pratiques',`<div class="grid g2"><div class="card"><ul class="clean">${['Images officielles ou éditeurs vérifiés','Images minimales (slim, alpine, distroless)','Versions épinglées, mises à jour régulières','Scanner chaque image (Docker Scout, Trivy) en CI','USER non-root, pas de sudo dans l\'image','Jamais de secret dans l\'image ni dans Git','.dockerignore (exclut .env, .git)'].map(x=>`<li>${x}</li>`).join('')}</ul></div><div class="card"><ul class="clean">${['Éviter --privileged et le montage de docker.sock','Publier uniquement les ports nécessaires','Réseaux séparés (front / back, internal)','Limiter CPU et mémoire (--memory, --cpus)','--read-only + tmpfs quand possible','--cap-drop ALL puis ajouter le strict nécessaire','Signer et vérifier les images (Docker Content Trust, cosign) quand c\'est pertinent'].map(x=>`<li>${x}</li>`).join('')}</ul></div></div>`)}
 ${sec('Scanner et gérer les secrets',`<div class="grid g2"><div class="card"><h3>Docker Scout</h3>${codeBlock('docker scout quickview mon-app:1.0\ndocker scout cves --only-severity critical,high mon-app:1.0\ndocker scout recommendations mon-app:1.0','bash')}<p class="small muted">Alternative open source : <span class="inline">trivy image mon-app:1.0</span>. ${REAL}</p></div>
  <div class="card"><h3>Secrets avec Compose</h3>${codeBlock('services:\n  api:\n    image: mon-org/api:1.4.2\n    secrets:\n      - db_password\n    environment:\n      DB_PASSWORD_FILE: /run/secrets/db_password\nsecrets:\n  db_password:\n    file: ./secrets/db_password.txt','yaml')}<p class="small muted">Le secret est monté en fichier dans /run/secrets, pas visible dans docker inspect. En production AWS : Secrets Manager.</p></div>
  <div class="card"><h3>Durcir un docker run</h3>${codeBlock('docker run -d --name api \\\n  --user 10001:10001 \\\n  --read-only --tmpfs /tmp \\\n  --cap-drop ALL \\\n  --security-opt no-new-privileges \\\n  --memory 512m --cpus 1 \\\n  -p 127.0.0.1:8000:8000 \\\n  mon-org/api:1.4.2','bash')}</div>
  <div class="card"><h3>Sauvegardes et persistance</h3><ul class="clean"><li>Données dans des volumes ou un service managé (RDS).</li><li>Sauvegardes automatiques, chiffrées, hors de la machine.</li><li>Test de restauration planifié.</li><li>Le principe du moindre privilège s'applique aussi aux comptes de sauvegarde.</li></ul></div></div>`)}
 ${sec('DOCKER SECURITY LAB',`<p class="muted">Pour chaque fichier, cliquez sur la ou les lignes problématiques, puis validez.</p><div class="tabs" id="sl-tabs">${SEC_SCEN.map((s,i)=>`<button class="${i?'':'on'}" data-k="${i}" type="button">${i+1}. ${s.t}</button>`).join('')}</div><div id="sl" class="card" style="display:grid;gap:10px"></div><p class="small muted" id="sl-score"></p>`,'LAB')}`},
 mount(root){let cur=0;const res={};
  const show=()=>{const s=SEC_SCEN[cur];let sel=new Set();$$('#sl-tabs button').forEach(b=>b.classList.toggle('on',+b.dataset.k===cur));
   $('#sl').innerHTML=`<div class="row between"><b class="mono">${s.file}</b>${s.miss?'<span class="small muted">Indice : un problème peut venir d\'une ligne qui manque ; cliquez alors la ligne où elle devrait être insérée.</span>':''}</div><div class="editor"><div class="lines">${s.lines.map((l,i)=>`<div class="ln" data-i="${i}"><span class="no">${i+1}</span><span>${hlLine(l,s.file==='Dockerfile'?'dockerfile':'yaml')}</span></div>`).join('')}</div></div><div class="row"><button class="btn primary" id="sl-val" type="button">Valider mon diagnostic</button></div><div id="sl-fb"></div>`;
   $$('#sl .ln').forEach(el=>el.onclick=()=>{const i=+el.dataset.i;sel.has(i)?sel.delete(i):sel.add(i);el.classList.toggle('sel')});
   $('#sl-val').onclick=()=>{const ok=s.bad.length===sel.size&&s.bad.every(b=>sel.has(b));res[cur]=ok;$$('#sl .ln').forEach(el=>{const i=+el.dataset.i;if(s.bad.includes(i))el.classList.add('warnl')});$('#sl-fb').innerHTML=`<div class="${ok?'okbox':'errbox'}"><b>${ok?'Bien vu.':'Pas exactement.'}</b> Ligne(s) en cause : ${s.bad.map(b=>b+1).join(', ')}. ${esc(s.x)}${s.miss?' '+esc(s.miss):''}</div>`;$('#sl-score').textContent=`Scénarios réussis : ${Object.values(res).filter(Boolean).length}/${SEC_SCEN.length}`}};
  $$('#sl-tabs button').forEach(b=>b.onclick=()=>{cur=+b.dataset.k;show()});show()}};

VIEWS.monitoring={html(){return `${mhead('monitoring','Diagnostiquer, c\'est observer avant d\'agir : état, logs, ressources, événements. Les mêmes réflexes servent en local et en production.')}
 ${sec('Tableau de bord des containers',`<div class="row">${SIM}<button class="btn sm danger" data-inc="crash" type="button">Provoquer un crash de l'API</button><button class="btn sm danger" data-inc="oom" type="button">Fuite mémoire</button><button class="btn sm danger" data-inc="db" type="button">Arrêter la base</button><button class="btn sm" data-inc="fix" type="button">Rétablir</button></div><div class="grid g4" id="mon"></div><div class="term"><div class="term-h"><div class="lights"><i></i><i></i><i></i></div><div class="ttl">docker compose logs -f</div></div><div class="term-out" id="mon-log" style="height:200px"></div></div>`,'LIVE')}
 ${sec('Commandes de diagnostic',`<div class="tbl"><table><tr><th>Commande</th><th>Question à laquelle elle répond</th></tr>${[['docker ps -a','Est-ce que ça tourne ? Quel code de sortie ?'],['docker logs --tail 100 api','Qu\'a dit l\'application avant de s\'arrêter ?'],['docker inspect api --format "{{.State.OOMKilled}} {{.RestartCount}}"','Tuée par manque de mémoire ? Combien de redémarrages ?'],['docker stats --no-stream','Qui consomme CPU et mémoire ?'],['docker events --since 10m','Que s\'est-il passé récemment (die, oom, restart) ?'],['docker exec -it api sh','Que voit-on depuis l\'intérieur (fichiers, réseau) ?'],['docker top api','Quels processus, avec quel utilisateur ?'],['docker compose logs -f','Vue agrégée de toute la stack']].map(c=>`<tr><td class="mono small">${esc(c[0])}</td><td>${esc(c[1])}</td></tr>`).join('')}</table></div>`)}
 ${sec('Diagnostiquer les incidents',`<div class="tabs" id="inc-tabs">${INCIDENTS.map((x,i)=>`<button class="${i?'':'on'}" data-k="${i}" type="button">${x.t}</button>`).join('')}</div><div id="inc" class="card" style="display:grid;gap:10px"></div><p class="small muted" id="inc-score"></p>`,'EXERCICES')}`},
 mount(root){
  const C=[{n:'nginx',img:'nginx:1.27-alpine',cpu:2,mem:9,lim:128,st:'running',h:'healthy',r:0,hist:[]},{n:'api',img:'mon-org/api:1.4.2',cpu:12,mem:180,lim:512,st:'running',h:'healthy',r:0,hist:[]},{n:'database',img:'postgres:16',cpu:6,mem:95,lim:1024,st:'running',h:'healthy',r:0,hist:[]},{n:'redis',img:'redis:7-alpine',cpu:1,mem:6,lim:256,st:'running',h:'healthy',r:0,hist:[]}];
  let mode=null;const lg=(n,t,c)=>{const el=$('#mon-log');if(!el)return;const d=document.createElement('div');d.textContent=`${(n+'-1').padEnd(12)}| ${t}`;if(c)d.className='l-'+c;el.appendChild(d);if(el.childNodes.length>200)el.removeChild(el.firstChild);el.scrollTop=1e6};
  const spark=h=>{if(h.length<2)return'';const W=200,H=34;const mx=Math.max(...h,1);const pts=h.map((v,i)=>[i*(W/(h.length-1)),H-2-(v/mx)*(H-6)]);const d='M'+pts.map(p=>p.map(x=>x.toFixed(1)).join(' ')).join(' L');return`<svg class="spark" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path class="area" d="${d} L${W} ${H} L0 ${H}Z"/><path d="${d}"/><circle cx="${pts[pts.length-1][0]}" cy="${pts[pts.length-1][1]}" r="2.5" fill="#3fdcef"/></svg>`};
  const draw=()=>{const m=$('#mon');if(!m)return;m.innerHTML=C.map(c=>`<div class="cbox ${c.st==='running'?'run':'stop'}" style="${c.h==='unhealthy'||c.st!=='running'?'border-color:var(--err)':''}"><div class="row between"><span class="nm">${c.n}</span><span class="pill ${c.st==='running'?(c.h==='healthy'?'ok':'warn'):'err'}">${c.st==='running'?c.h:c.st}</span></div><div class="dim mono" style="font-size:.7rem">${c.img}</div>
   <div class="small tnum" style="margin-top:6px">CPU <b>${c.cpu.toFixed(1)} %</b> · RAM <b>${Math.round(c.mem)}/${c.lim} Mo</b></div><div class="meter" style="margin:4px 0"><i style="width:${Math.min(100,c.mem/c.lim*100)}%;${c.mem/c.lim>.85?'background:var(--err)':''}"></i></div>${spark(c.hist)}<div class="small dim tnum">Net ${(c.cpu*3.1).toFixed(0)} ko/s · Restarts <b style="color:${c.r?'var(--warn)':'inherit'}">${c.r}</b></div></div>`).join('')};
  const tick=()=>{C.forEach(c=>{if(c.st==='running'){c.cpu=Math.max(.2,c.cpu+(Math.random()-.5)*(c.n==='api'?6:2));if(c.n==='api'&&mode==='oom'){c.mem+=38;if(c.mem>=c.lim){c.st='restarting';c.h='—';c.r++;lg('api','Killed (OOMKilled: true, exit code 137)','err');setTimeout(()=>{c.mem=180;c.st='running';c.h='starting';lg('api','[INFO] Booting worker with pid: 8')},1500)}}else c.mem=Math.max(4,c.mem+(Math.random()-.5)*4)}else c.cpu=0;c.hist.push(c.cpu);if(c.hist.length>30)c.hist.shift()});
   if(Math.random()<.5){const c=C[Math.floor(Math.random()*4)];if(c.st==='running'){if(c.n==='nginx')lg('nginx',`172.18.0.1 - - "GET /api/orders HTTP/1.1" ${mode==='crash'||mode==='db'?502:200}`);if(c.n==='api'&&mode==='db')lg('api','psycopg.OperationalError: connection to server at "database" failed: Connection refused','err');else if(c.n==='api'&&mode!=='crash')lg('api','"GET /api/orders" 200 12ms')}}
   const api=C[1];if(api.h==='starting'&&api.st==='running'&&mode!=='crash')api.h='healthy';draw()};
  const iv=setInterval(()=>{if(document.visibilityState==='visible')tick()},1500);onLeave(()=>clearInterval(iv));
  let crashT=null;onLeave(()=>clearInterval(crashT));
  $$('[data-inc]',root).forEach(b=>b.onclick=()=>{const k=b.dataset.inc;const api=C[1],db=C[2];clearInterval(crashT);

 ${sec('Cluster visualisé',`<div class="card" style="display:grid;gap:12px"><div class="row"><label for="k-rep"><b>Répliques du Deployment web : <span id="k-rv">3</span></b></label><input type="range" id="k-rep" min="0" max="9" value="3" style="flex:1;min-width:140px;accent-color:var(--docker)"></div><p class="small muted">Cliquez un pod pour le « tuer » : observez l'auto-réparation.</p><div id="k-viz"></div></div>`,SIM)}
 ${sec('Manifeste et kubectl',`<div class="split"><div>${codeBlock(`apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:

---

 mount(root){

  const draw=()=>{const box=$('#k-viz');if(!box)return;const pods=K.pods.filter(p=>p.dep==='web');box.innerHTML=`<div class="grid g3"><div class="card" style="background:#2a2457"><b>Control plane</b><p class="small muted">API server · scheduler · controller manager · etcd</p><p class="small">État voulu : <b>${K.deps.web?K.deps.web.r:0}</b> pods · réel : <b>${pods.filter(p=>p.status==='Running').length}</b></p></div>${['worker-1','worker-2'].map(n=>`<div class="card"><b>${n}</b><div class="boxes" style="margin-top:8px">${pods.filter(p=>p.node===n).map(p=>`<button class="cbox ${p.status==='Running'?'run':''}" data-pod="${p.name}" type="button" style="min-width:120px;text-align:left;cursor:pointer;color:inherit;font:inherit"><span class="nm" style="font-size:.7rem">${p.name.slice(-11)}</span><br><span class="pill ${p.status==='Running'?'ok':'warn'}">${p.status}</span><br><span class="dim small">container nginx</span></button>`).join('')||'<span class="dim small">aucun pod</span>'}</div></div>`).join('')}</div>`;
   $$('[data-pod]',box).forEach(b=>b.onclick=()=>{const p=K.pods.find(x=>x.name===b.dataset.pod);if(!p)return;p.status='Terminating';draw();setTimeout(()=>{K.pods=K.pods.filter(x=>x!==p);const h=hex(10);if(K.deps.web){const np={name:`web-${h}-${hex(5)}`,dep:'web',img:'nginx:1.27',status:'ContainerCreating',restarts:0,node:p.node==='worker-1'?'worker-2':'worker-1',age:Date.now()};K.pods.push(np);draw();setTimeout(()=>{np.status='Running';draw()},900)}toast('Pod supprimé : le Deployment en recrée un')},600)})};
  $('#k-rep').oninput=e=>{rep=+e.target.value;$('#k-rv').textContent=rep;if(!K.deps.web)K.deps.web={img:'nginx:1.27',r:0};K.deps.web.r=rep;K.mkPods('web','nginx:1.27',rep);K.pods.forEach((p,i)=>{if(p.dep==='web')p.node=i%2?'worker-2':'worker-1'});draw()};

 <div class="grid g3" id="ms-list">${MISSIONS.map((m,i)=>`<button class="cmd-item ${Store.d.missions[m.id]?'on':''}" data-k="${i}" type="button" style="padding:12px"><span class="row between"><b style="font-size:.9rem">${esc(m.t)}</b>${Store.d.missions[m.id]?'<span class="pill ok">✓</span>':''}</span><span>${esc(m.brief)}</span></button>`).join('')}</div><div id="ms"></div>`},
 mount(root){let cur=0;
  const open=k=>{cur=k;const m=MISSIONS[k];$$('#ms-list .cmd-item').forEach((b,i)=>b.style.borderColor=i===k?'var(--cyan)':'');let hintN=0;const sim=new DockerSim();if(m.kind==='df')sim.files=sim.files.filter(f=>f!=='Dockerfile');if(m.setup)m.setup(sim);
   const ctx={sim,hist:[],okHist:[],ed:m.start||'',cv:null,wv:null,wd:null,pol:null};
   $('#ms').innerHTML=`<section class="card" style="display:grid;gap:14px;margin-top:6px"><div class="row between"><div><div class="eyebrow">DevOps Mission</div><h2>${esc(m.t)}</h2></div><button class="btn sm ghost" id="ms-reset" type="button">Recommencer</button></div><p class="analogy" style="border-color:var(--docker)"><b style="color:var(--docker)">Briefing · </b>${esc(m.brief)}</p>
    <div class="split"><div style="display:grid;gap:10px;min-width:0" id="ms-work"></div><div style="display:grid;gap:10px;align-content:start;min-width:0"><div class="card"><h3>Objectifs</h3><div id="ms-obj" class="grid" style="gap:6px;margin-top:8px"></div></div><div class="card"><div class="row between"><h3>Indices</h3><button class="btn sm" id="ms-hint" type="button">Indice suivant</button></div><div id="ms-hints" class="grid" style="gap:6px;margin-top:8px"><p class="small muted">${m.hints.length} indices disponibles, du plus général au plus précis.</p></div></div></div></div></section>`;
   const work=$('#ms-work');
   const check=()=>{const res=m.obj.map(o=>{try{return!!o[1](ctx)}catch(e){return false}});$('#ms-obj').innerHTML=m.obj.map((o,i)=>`<div class="row" style="gap:8px;align-items:flex-start;flex-wrap:nowrap"><span class="pill ${res[i]?'ok':''}" style="flex:none">${res[i]?'✓':i+1}</span><span class="small">${esc(o[0])}</span></div>`).join('');
    if(res.every(Boolean)&&!Store.d.missions[m.id]){Store.d.missions[m.id]=Date.now();Store.save();toast('Mission accomplie : +30 XP');renderNav();$('#ms-obj').insertAdjacentHTML('beforeend','<div class="okbox"><b>Mission accomplie.</b> +30 XP</div>');const b=$$('#ms-list .cmd-item')[k];b.classList.add('on')}else if(res.every(Boolean))$('#ms-obj').insertAdjacentHTML('beforeend','<div class="okbox">Mission déjà accomplie. Bravo.</div>')};
   const termOpts={sim,id:'ms-term-'+m.id,onCommand:(line,ok)=>{ctx.hist.push(line.trim());if(ok)ctx.okHist.push(line.trim());check()},welcome:`Terminal de mission (simulé, environnement isolé).${m.setup?' Un incident est en cours : commencez par observer.':''}`};
   if(m.kind==='df'){work.innerHTML=`<label class="small muted" for="ms-df">Dockerfile</label><textarea id="ms-df" rows="10" spellcheck="false"></textarea><div class="row"><button class="btn" id="ms-save" type="button">Enregistrer le Dockerfile</button><span id="ms-dfs" class="small"></span></div><div id="ms-t"></div>`;const ta=$('#ms-df');ta.value=ctx.ed;
    $('#ms-save').onclick=()=>{ctx.ed=ta.value;if(M_DF_OK(ta.value)){if(!sim.files.includes('Dockerfile'))sim.files.push('Dockerfile');$('#ms-dfs').innerHTML='<span style="color:var(--ok)">Dockerfile enregistré et valide.</span>'}else $('#ms-dfs').innerHTML='<span style="color:var(--warn)">Enregistré, mais incomplet : vérifiez l\'objectif 1.</span>';check()};new Terminal($('#ms-t'),{...termOpts,sugg:['ls','docker build -t mon-app .','docker images','docker run -d --name app -p 8080:8000 mon-app','docker logs app','curl localhost:8080']})}
   else if(m.kind==='term'){new Terminal(work,{...termOpts,sugg:m.id==='m9'?['docker ps','docker ps -a','docker logs api','docker inspect api'] :['docker ps -a','docker volume ls','docker network ls','docker images']})}
   else{work.innerHTML=`<label class="small muted" for="ms-ed">${m.kind==='json'?'policy.json':m.kind==='yaml'?'compose.yaml':'.github/workflows/ci.yml'}</label><textarea id="ms-ed" rows="18" spellcheck="false"></textarea><div id="ms-v"></div>`;const ta=$('#ms-ed');ta.value=ctx.ed;
    const ev=()=>{ctx.ed=ta.value;let msg='';
     if(m.kind==='yaml'){try{ctx.cv=validateCompose(parseYAML(ta.value))}catch(e){ctx.cv={errs:[e.message],warns:[],svcs:[]}}msg=ctx.cv.errs.map(e=>`<div class="errbox">${esc(e)}</div>`).join('')}
     if(m.kind==='gha'){try{ctx.wd=parseYAML(ta.value);ctx.wv=validateWorkflow(ctx.wd)}catch(e){ctx.wd=null;ctx.wv={errs:[e.message],warns:[],jobs:[]}}msg=ctx.wv.errs.map(e=>`<div class="errbox">${esc(e)}</div>`).join('')}
     if(m.kind==='json'){try{const p=JSON.parse(ta.value);ctx.pol=p&&Array.isArray(p.Statement)?p:null;if(!ctx.pol)msg='<div class="errbox">Il faut un objet avec un tableau "Statement".</div>';else msg=`<div class="tbl"><table style="min-width:0">${IAM_REQS.map(r=>{const al=iamEval(ctx.pol.Statement,r)==='allow';return`<tr><td class="small">${esc(r.d)}</td><td><span class="pill ${al?'ok':'err'}">${al?'Allow':'Deny'}</span></td><td>${al===r.want?'✓':'✗'}</td></tr>`}).join('')}</table></div>`}catch(e){ctx.pol=null;msg=`<div class="errbox">JSON invalide : ${esc(e.message)}</div>`}}
     $('#ms-v').innerHTML=msg;check()};let deb;ta.oninput=()=>{clearTimeout(deb);deb=setTimeout(ev,250)};ev()}
   $('#ms-hint').onclick=()=>{if(hintN>=m.hints.length){toast('Plus d\'indice : vous avez tout !');return}if(!hintN)$('#ms-hints').innerHTML='';$('#ms-hints').insertAdjacentHTML('beforeend',`<div class="warnbox small"><b>Indice ${hintN+1} · </b><span class="mono" style="white-space:pre-wrap">${esc(m.hints[hintN])}</span></div>`);hintN++};
   $('#ms-reset').onclick=()=>open(k);check()};
  $$('#ms-list .cmd-item').forEach(b=>b.onclick=()=>{open(+b.dataset.k);$('#ms').scrollIntoView({behavior:'smooth'})});open(0);
 }};

/* ===================== QUIZ ===================== */
VIEWS.quiz={html(){return `${mhead('quiz','Six niveaux, du Beginner à l\'Expert Challenge : QCM, vrai/faux, réponses multiples, compléter une commande, diagnostics et scénarios IAM. Correction immédiate et explication de chaque option.')}
 <div class="grid g3" id="qz-levels">${Object.entries(QUIZ).map(([k,l])=>{const b=Store.d.quiz[k];return`<button class="cmd-item" data-l="${k}" type="button" style="padding:14px"><span class="row between"><b>Niveau ${k} · ${l.t}</b>${b!=null?`<span class="pill ${b>=70?'ok':'warn'}">${b} %</span>`:''}</span><span>${l.sub} · ${l.q.length} questions</span></button>`}).join('')}</div>
 <div class="row"><label class="chk"><input type="checkbox" id="qz-timer"> Chronomètre (45 s par question)</label><label class="chk"><input type="checkbox" id="qz-shuffle" checked> Mélanger les questions</label></div><div id="qz"></div>`},
 mount(root){let timerIv=null;onLeave(()=>clearInterval(timerIv));
  const start=lvl=>{clearInterval(timerIv);const L=QUIZ[lvl];let qs=L.q.slice();if($('#qz-shuffle').checked)qs.sort(()=>Math.random()-.5);let i=0,score=0;const wrong={};const timed=$('#qz-timer').checked;
   const box=$('#qz');const next=()=>{clearInterval(timerIv);if(i>=qs.length)return end();const q=qs[i];
    box.innerHTML=`<section class="card" style="display:grid;gap:12px;margin-top:6px"><div class="row between"><b>Niveau ${lvl} · ${L.t}</b><span class="small tnum">Question ${i+1}/${qs.length} · Score <b>${score}</b>${timed?` · <span id="qz-t" class="mono">45 s</span>`:''}</span></div><div class="meter"><i style="width:${i/qs.length*100}%"></i></div><div id="qz-q"></div><div class="row" style="justify-content:flex-end"><button class="btn primary" id="qz-next" type="button" disabled>${i+1<qs.length?'Question suivante →':'Voir mon résultat'}</button></div></section>`;
    let answered=false;renderQuestion($('#qz-q'),q,ok=>{answered=true;clearInterval(timerIv);if(ok)score++;else wrong[q.tag]=(wrong[q.tag]||0)+1;$('#qz-next').disabled=false});
    $('#qz-next').onclick=()=>{i++;next()};
    if(timed){let t=45;timerIv=setInterval(()=>{t--;const el=$('#qz-t');if(el)el.textContent=t+' s';if(t<=0){clearInterval(timerIv);if(!answered){answered=true;wrong[q.tag]=(wrong[q.tag]||0)+1;$$('#qz-q .opt, #qz-q input, #qz-q [data-a=val]').forEach(x=>x.disabled=true);$('#qz-q .fb').innerHTML=`<div class="errbox"><b>Temps écoulé.</b> ${esc(q.x)}</div>`;$('#qz-next').disabled=false}}},1000)}};
   const end=()=>{const pct=Math.round(score/qs.length*100);const prev=Store.d.quiz[lvl];if(prev==null||pct>prev)Store.d.quiz[lvl]=pct;Store.d.qhist.push({lvl,pct,at:Date.now()});Store.d.qhist=Store.d.qhist.slice(-40);Object.entries(wrong).forEach(([t,n])=>Store.d.gaps[t]=(Store.d.gaps[t]||0)+n);Store.save();renderNav();
    const recs=Object.keys(wrong).map(t=>MODULES.find(m=>m.id===t)||MODULES.find(m=>m.id==='terminal'));
    box.innerHTML=`<section class="card" style="display:grid;gap:12px;margin-top:6px"><h2>Résultat · ${pct} %</h2><div class="meter"><i style="width:${pct}%;${pct<70?'background:var(--warn)':''}"></i></div><p>${score}/${qs.length} bonnes réponses. ${pct>=70?'Niveau validé (seuil 70 %).':'Seuil de validation : 70 %. Révisez puis réessayez.'}</p>
     ${recs.length?`<div class="warnbox"><b>Recommandations de révision</b><ul class="clean">${[...new Set(recs)].map(m=>`<li><a href="#${m.id}">${esc(m.t)}</a> (${wrong[m.id]||wrong.commandes||1} erreur(s))</li>`).join('')}</ul></div>`:'<div class="okbox">Aucune lacune détectée sur ce niveau.</div>'}
     <div class="row"><button class="btn primary" id="qz-again" type="button">Recommencer ce niveau</button>${QUIZ[+lvl+1]?`<button class="btn" id="qz-nextl" type="button">Niveau suivant : ${QUIZ[+lvl+1].t}</button>`:''}</div></section>`;
    $('#qz-again').onclick=()=>start(lvl);const nl=$('#qz-nextl');if(nl)nl.onclick=()=>start(String(+lvl+1));
    $$('#qz-levels [data-l]').forEach(b=>{const v=Store.d.quiz[b.dataset.l];const sp=b.querySelector('.pill');if(v!=null){if(sp){sp.textContent=v+' %';sp.className='pill '+(v>=70?'ok':'warn')}else b.querySelector('.row').insertAdjacentHTML('beforeend',`<span class="pill ${v>=70?'ok':'warn'}">${v} %</span>`)}})};
   next();box.scrollIntoView({behavior:'smooth',block:'start'})};
  $$('#qz-levels [data-l]').forEach(b=>b.onclick=()=>start(b.dataset.l));
  $('#qz').innerHTML='<div class="card flat"><p class="muted">Choisissez un niveau pour commencer. Conseil : suivez l\'ordre, chaque niveau suppose le précédent.</p></div>';
 }};

/* ===================== GLOSSAIRE ===================== */
VIEWS.glossaire={html(){return `${mhead('glossaire',`${GLOSSARY.length} termes, chacun avec une définition simple, une définition technique, un exemple et une analogie.`)}
 <div class="row"><input type="search" id="gl-q" placeholder="Rechercher un terme (ex. volume, rôle, pod)" aria-label="Rechercher un terme" style="flex:1 1 260px;min-width:0"></div><div class="row" id="gl-letters"></div><div class="grid g2" id="gl"></div>`},
 mount(root){let q='',L='';const letters=[...new Set(GLOSSARY.map(g=>g[0][0].toUpperCase()))].sort();
  $('#gl-letters').innerHTML=`<button class="btn sm on" data-l="" type="button">Tous</button>`+letters.map(l=>`<button class="btn sm" data-l="${l}" type="button">${l}</button>`).join('');
  const draw=()=>{const r=GLOSSARY.filter(g=>(!L||g[0][0].toUpperCase()===L)&&(!q||g.join(' ').toLowerCase().includes(q))).sort((a,b)=>a[0].localeCompare(b[0]));
   $('#gl').innerHTML=r.length?r.map(g=>`<article class="card" style="display:grid;gap:6px"><h3 style="color:var(--cyan)">${esc(g[0])}</h3><p><b>En bref · </b>${esc(g[1])}</p><p class="small muted"><b>Technique · </b>${esc(g[2])}</p><p class="small"><b>Exemple · </b><span class="inline" style="white-space:normal">${esc(g[3])}</span></p>${ana(esc(g[4]))}</article>`).join(''):'<p class="muted">Aucun terme trouvé.</p>'};
  $('#gl-q').oninput=e=>{q=e.target.value.toLowerCase();draw()};$$('#gl-letters button').forEach(b=>b.onclick=()=>{L=b.dataset.l;$$('#gl-letters button').forEach(x=>x.classList.toggle('on',x===b));draw()});draw()}};

/* ===================== CHEAT SHEET ===================== */
VIEWS.cheatsheet={html(){const cats=[...new Set(COMMANDS.map(c=>c.cat))];return `${mhead('cheatsheet','La fiche de révision : les 30 commandes indispensables classées par fréquence d\'utilisation, puis la référence complète filtrable, AWS CLI et kubectl.')}
 ${sec('Les 30 commandes que tout ingénieur Docker doit connaître',`<p class="small muted">Classées de la plus fréquente à la moins fréquente dans le travail quotidien.</p><div class="tbl"><table><tr><th>#</th><th>Commande</th><th>Usage</th><th></th></tr>${TOP30.map((c,i)=>`<tr><td class="mono dim">${i+1}</td><td class="mono" style="white-space:nowrap">${esc(c[0])}</td><td>${esc(c[1])}</td><td><button class="copy" data-cp="${esc(c[0])}" type="button">Copier</button></td></tr>`).join('')}</table></div>`,'TOP 30')}
 ${sec('Référence complète',`<div class="row"><input type="search" id="cs-q" placeholder="Filtrer…" aria-label="Filtrer les commandes" style="flex:1 1 220px;min-width:0"><select id="cs-c" aria-label="Catégorie" style="max-width:200px"><option value="">Toutes catégories</option>${cats.map(c=>`<option>${c}</option>`).join('')}</select></div><div class="tbl"><table id="cs-t"></table></div>`)}
 ${sec('AWS CLI',`<div class="tbl"><table><tr><th>Commande</th><th>Rôle</th><th></th></tr>${AWSCLI.map(c=>`<tr><td class="mono small" style="word-break:break-all">${esc(c[0])}</td><td>${esc(c[1])}</td><td><button class="copy" data-cp="${esc(c[0])}" type="button">Copier</button></td></tr>`).join('')}</table></div>`)}
 ${sec('kubectl (introduction)',`<div class="tbl"><table><tr><th>Commande</th><th>Rôle</th></tr>${[['kubectl get nodes','Nœuds du cluster'],['kubectl get pods -o wide','Pods et nœud d\'exécution'],['kubectl apply -f deploy.yaml','Créer/mettre à jour l\'état voulu'],['kubectl describe pod NOM','Détails et événements (diagnostic)'],['kubectl logs -f NOM','Logs d\'un pod'],['kubectl scale deployment web --replicas=5','Changer le nombre de répliques'],['kubectl rollout undo deployment/web','Rollback'],['kubectl delete -f deploy.yaml','Supprimer les ressources du fichier']].map(c=>`<tr><td class="mono">${esc(c[0])}</td><td>${esc(c[1])}</td></tr>`).join('')}</table></div>`)}`},
 mount(root){const draw=()=>{const q=$('#cs-q').value.toLowerCase(),c=$('#cs-c').value;const r=COMMANDS.filter(x=>(!c||x.cat===c)&&(!q||(x.c+x.d).toLowerCase().includes(q)));$('#cs-t').innerHTML=`<tr><th>Commande</th><th>Description</th><th>Exemple</th><th></th></tr>`+r.map(x=>`<tr><td class="mono" style="white-space:nowrap">${esc(x.c)} <b class="danger-${x.danger}" title="niveau de danger">●</b></td><td>${esc(x.d)}</td><td class="mono small">${esc(x.ex)}</td><td><button class="copy" data-cp="${esc(x.ex)}" type="button">Copier</button></td></tr>`).join('')||'<tr><td colspan="4" class="muted">Aucun résultat.</td></tr>'};
  $('#cs-q').oninput=draw;$('#cs-c').onchange=draw;draw()}};
document.addEventListener('click',e=>{const b=e.target.closest('[data-cp]');if(b)copyText(b.dataset.cp,b)});

/* ===================== DÉMARRAGE ===================== */
function boot(){
  $('#menu-btn').onclick=()=>{const s=$('.side');s.classList.add('open');const sc=document.createElement('div');sc.className='scrim';sc.onclick=()=>{s.classList.remove('open');sc.remove()};document.body.appendChild(sc)};
  window.addEventListener('hashchange',render);
  setInterval(()=>{if(document.visibilityState==='visible'){Store.d.time+=15;Store.save()}},15000);
  render();
}
boot();

</script>
